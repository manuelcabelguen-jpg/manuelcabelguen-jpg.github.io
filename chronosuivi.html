        const StageBuilder = ({ stages, setStages, participantCount }) => {
            const [isEditing, setIsEditing] = useState(null);

            const addStage = () => {
                const newStage = {
                    id: crypto.randomUUID(),
                    name: "Nouvelle étape",
                    type: "work",
                    phase: "pendant",
                    calcMode: "fixed",
                    schedulingMode: "program_schedule",
                    duration: 1,
                    description: "",
                    participantOverride: 0
                };
                setStages([...stages, newStage]);
                setIsEditing(newStage.id);
            };

            const updateStage = (id, field, value) => {
                setStages(stages.map(s => s.id === id ? { ...s, [field]: value } : s));
            };

            const removeStage = (id) => {
                if (confirm("Supprimer cette étape ?")) {
                    setStages(stages.filter(s => s.id !== id));
                }
            };

            const moveStage = (index, direction) => {
                const newStages = [...stages];
                if (direction === 'up' && index > 0) {
                    [newStages[index], newStages[index - 1]] = [newStages[index - 1], newStages[index]];
                } else if (direction === 'down' && index < newStages.length - 1) {
                    [newStages[index], newStages[index + 1]] = [newStages[index + 1], newStages[index]];
                }
                setStages(newStages);
            };

            return (
                <SectionCard title="Configuration des Étapes" icon={Layers}>
                    <div className="mb-4">
                        <button onClick={addStage} className="w-full py-2 border-2 border-dashed border-blue-200 rounded-lg text-blue-600 font-bold text-xs hover:bg-blue-50 transition-colors flex items-center justify-center gap-2">
                            <Plus className="w-4 h-4" /> Ajouter une étape
                        </button>
                    </div>
                    <div className="space-y-3 max-h-[600px] overflow-y-auto custom-scrollbar p-1">
                        {stages.map((stage, index) => (
                            <div key={stage.id} className="bg-white border border-slate-200 rounded-lg shadow-sm group">
                                <div className="p-3 flex items-center gap-3">
                                    <div className="flex flex-col gap-1">
                                        <button onClick={() => moveStage(index, 'up')} disabled={index === 0} className="text-slate-300 hover:text-blue-600 disabled:opacity-30"><ChevronUp className="w-3 h-3" /></button>
                                        <button onClick={() => moveStage(index, 'down')} disabled={index === stages.length - 1} className="text-slate-300 hover:text-blue-600 disabled:opacity-30"><ChevronDown className="w-3 h-3" /></button>
                                    </div>
                                    <div className="flex-1 cursor-pointer" onClick={() => setIsEditing(isEditing === stage.id ? null : stage.id)}>
                                        <div className="flex items-center gap-2 mb-1">
                                            <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-500 uppercase">{index + 1}</span>
                                            <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded uppercase ${stage.phase === 'avant' ? 'bg-indigo-50 text-indigo-600' : stage.phase === 'pendant' ? 'bg-blue-50 text-blue-600' : 'bg-emerald-50 text-emerald-600'}`}>{stage.phase}</span>
                                            <span className="font-bold text-sm text-slate-700">{stage.name}</span>
                                        </div>
                                        <div className="text-[10px] text-slate-400 flex gap-2">
                                            <span>{stage.type === 'work' ? 'Travail' : stage.type === 'milestone' ? 'Jalon' : 'Attente'}</span>
                                            <span>•</span>
                                            <span>{stage.duration} {stage.calcMode === 'fixed_sessions' ? 'séances' : 'jours'}</span>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2">
                                         <button onClick={() => setIsEditing(isEditing === stage.id ? null : stage.id)} className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded"><Settings className="w-4 h-4" /></button>
                                         <button onClick={() => removeStage(stage.id)} className="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded"><Trash2 className="w-4 h-4" /></button>
                                    </div>
                                </div>

                                {isEditing === stage.id && (
                                    <div className="p-4 border-t border-slate-100 bg-slate-50/50 space-y-3 animate-in fade-in slide-in-from-top-1 duration-200">
                                        <div className="grid grid-cols-12 gap-3">
                                            <div className="col-span-8">
                                                <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Nom de l'étape</label>
                                                <input type="text" value={stage.name} onChange={(e) => updateStage(stage.id, 'name', e.target.value)} className="w-full text-xs border-slate-200 rounded" />
                                            </div>
                                            <div className="col-span-4">
                                                <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Phase</label>
                                                <select value={stage.phase} onChange={(e) => updateStage(stage.id, 'phase', e.target.value)} className="w-full text-xs border-slate-200 rounded">
                                                    <option value="avant">Avant</option>
                                                    <option value="pendant">Pendant</option>
                                                    <option value="apres">Après</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-12 gap-3">
                                            <div className="col-span-4">
                                                 <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Type</label>
                                                 <select value={stage.type} onChange={(e) => updateStage(stage.id, 'type', e.target.value)} className="w-full text-xs border-slate-200 rounded">
                                                    <option value="work">Travail</option>
                                                    <option value="milestone">Jalon (Date fixe)</option>
                                                    <option value="delay">Attente (Délai)</option>
                                                </select>
                                            </div>
                                            <div className="col-span-4">
                                                 <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Durée / Qté</label>
                                                 <input type="number" min="0" step="0.5" value={stage.duration} onChange={(e) => updateStage(stage.id, 'duration', parseFloat(e.target.value))} className="w-full text-xs border-slate-200 rounded" />
                                            </div>
                                            <div className="col-span-4">
                                                 <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Mode Calcul</label>
                                                 <select value={stage.calcMode} onChange={(e) => updateStage(stage.id, 'calcMode', e.target.value)} disabled={stage.type !== 'work'} className="w-full text-xs border-slate-200 rounded disabled:opacity-50">
                                                    <option value="fixed">Fixe (Jours)</option>
                                                    <option value="fixed_sessions">Fixe (Séances)</option>
                                                    <option value="linear_1d">Linéaire (1j/p)</option>
                                                    <option value="linear_0.5d">Linéaire (0.5j/p)</option>
                                                    <option value="capacity_4d">Capacité (4/j)</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-12 gap-3">
                                            <div className="col-span-6">
                                                <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Planification</label>
                                                <select value={stage.schedulingMode} onChange={(e) => updateStage(stage.id, 'schedulingMode', e.target.value)} disabled={stage.type !== 'work'} className="w-full text-xs border-slate-200 rounded disabled:opacity-50">
                                                    <option value="any_weekday">Jours ouvrables (Lun-Ven)</option>
                                                    <option value="program_schedule">Selon Horaire Programme</option>
                                                </select>
                                            </div>
                                            <div className="col-span-6">
                                                 <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Participants (Override)</label>
                                                 <input type="number" min="0" placeholder={`Défaut: ${participantCount}`} value={stage.participantOverride || ''} onChange={(e) => updateStage(stage.id, 'participantOverride', parseInt(e.target.value) || 0)} className="w-full text-xs border-slate-200 rounded" />
                                            </div>
                                        </div>

                                        <div>
                                            <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Description</label>
                                            <input type="text" value={stage.description} onChange={(e) => updateStage(stage.id, 'description', e.target.value)} className="w-full text-xs border-slate-200 rounded" />
                                        </div>
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </SectionCard>
            );
        };

        const ConstraintManager = ({ constraints, setConstraints }) => {
            const [newConstraint, setNewConstraint] = useState({ name: '', startDate: '', endDate: '', type: 'full' });

            const addConstraint = () => {
                if (!newConstraint.name || !newConstraint.startDate || !newConstraint.endDate) return;
                setConstraints([...constraints, { id: crypto.randomUUID(), ...newConstraint }]);
                setNewConstraint({ name: '', startDate: '', endDate: '', type: 'full' });
            };

            const removeConstraint = (id) => {
                setConstraints(constraints.filter(c => c.id !== id));
            };

            return (
                <SectionCard title="Jours Fériés & Contraintes" icon={AlertTriangle} defaultOpen={false}>
                    <div className="bg-amber-50 border border-amber-100 rounded-lg p-3 mb-4">
                        <div className="grid grid-cols-12 gap-2 mb-2">
                             <div className="col-span-4">
                                <label className="text-[10px] font-bold text-amber-700 uppercase block mb-1">Nom</label>
                                <input type="text" value={newConstraint.name} onChange={e => setNewConstraint({...newConstraint, name: e.target.value})} className="w-full text-xs border-amber-200 rounded" placeholder="Ex: Congé..." />
                             </div>
                             <div className="col-span-3">
                                <label className="text-[10px] font-bold text-amber-700 uppercase block mb-1">Début</label>
                                <input type="date" value={newConstraint.startDate} onChange={e => setNewConstraint({...newConstraint, startDate: e.target.value})} className="w-full text-xs border-amber-200 rounded" />
                             </div>
                             <div className="col-span-3">
                                <label className="text-[10px] font-bold text-amber-700 uppercase block mb-1">Fin</label>
                                <input type="date" value={newConstraint.endDate} onChange={e => setNewConstraint({...newConstraint, endDate: e.target.value})} className="w-full text-xs border-amber-200 rounded" />
                             </div>
                             <div className="col-span-2">
                                <label className="text-[10px] font-bold text-amber-700 uppercase block mb-1">Type</label>
                                <select value={newConstraint.type} onChange={e => setNewConstraint({...newConstraint, type: e.target.value})} className="w-full text-xs border-amber-200 rounded">
                                    <option value="full">Jour complet</option>
                                    <option value="am">Matin (AM)</option>
                                    <option value="pm">Après-midi (PM)</option>
                                </select>
                             </div>
                        </div>
                        <button onClick={addConstraint} className="w-full bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold py-1.5 rounded transition-colors">Ajouter la contrainte</button>
                    </div>

                    <div className="space-y-2 max-h-[300px] overflow-y-auto custom-scrollbar">
                        {constraints.length === 0 && <p className="text-center text-xs text-slate-400 italic py-2">Aucune contrainte définie.</p>}
                        {constraints.map(c => (
                            <div key={c.id} className="flex items-center justify-between bg-white border border-slate-200 p-2 rounded shadow-sm text-xs">
                                <div>
                                    <div className="font-bold text-slate-700">{c.name}</div>
                                    <div className="text-slate-500 flex gap-2">
                                        <span>{formatDateShort(parseDate(c.startDate))} {c.startDate !== c.endDate && `au ${formatDateShort(parseDate(c.endDate))}`}</span>
                                        <span className="uppercase bg-slate-100 px-1 rounded text-[10px]">{c.type === 'full' ? 'Complet' : c.type}</span>
                                    </div>
                                </div>
                                <button onClick={() => removeConstraint(c.id)} className="text-slate-300 hover:text-red-500"><XCircle className="w-4 h-4" /></button>
                            </div>
                        ))}
                    </div>
                </SectionCard>
            );
        };

        // --- MAIN APP ---

        const STORAGE_KEY = 'chronosuivi_v586_final_fix';
        const loadState = (key, defaultValue) => {
          try { const saved = localStorage.getItem(STORAGE_KEY + '_' + key); return saved ? JSON.parse(saved) : defaultValue; }
          catch (e) { return defaultValue; }
        };

        function App() {
          const fileInputRef = useRef(null);
          const [programName, setProgramName] = useState(() => loadState('programName', 'Programme MPCI-DS-IÉ'));
          const [intervenantName, setIntervenantName] = useState(() => loadState('intervenantName', ''));
          const [participantCount, setParticipantCount] = useState(() => loadState('participantCount', 10));
          const [marginPercent, setMarginPercent] = useState(() => loadState('marginPercent', 15));
          const [startDate, setStartDate] = useState(() => loadState('startDate', new Date().toISOString().split('T')[0]));

          const defaultScheduleNew = [
            { dayIndex: 1, label: 'Lun', am: true, pm: true },
            { dayIndex: 2, label: 'Mar', am: true, pm: true },
            { dayIndex: 3, label: 'Mer', am: true, pm: true },
            { dayIndex: 4, label: 'Jeu', am: true, pm: true },
            { dayIndex: 5, label: 'Ven', am: true, pm: true },
            { dayIndex: 6, label: 'Sam', am: false, pm: false },
            { dayIndex: 0, label: 'Dim', am: false, pm: false },
          ];

          const [schedule, setSchedule] = useState(() => {
             const saved = loadState('schedule', null);
             if (!saved) return defaultScheduleNew;
             if (saved.length > 0 && 'active' in saved[0]) return saved.map(s => ({ dayIndex: s.dayIndex, label: s.label, am: s.active, pm: s.active }));
             return saved;
          });

          const [scheduleChanges, setScheduleChanges] = useState(() => loadState('scheduleChanges', []));

          // Load stages or default from MPCI template
          const [stages, setStages] = useState(() => {
             const saved = loadState('stages', null);
             if (!saved) return PROGRAM_TEMPLATES[0].stages; // Default to MPCI
             return saved.map(s => ({
                 ...s,
                 phase: s.phase || 'pendant',
                 calcMode: s.calcMode || 'fixed',
                 schedulingMode: s.schedulingMode || 'any_weekday',
                 participantOverride: s.participantOverride
             }));
          });

          const [selectedTemplate, setSelectedTemplate] = useState('mpci');

          const [constraints, setConstraints] = useState(() => {
              const saved = loadState('constraints', null);
              if (saved && saved.length > 0) return saved;
              return generateFederalHolidays();
          });

          const [participantEvents, setParticipantEvents] = useState(() => loadState('participantEvents', []));

          // NEW STATE: PARTICIPANTS
          const [participants, setParticipants] = useState(() => loadState('participants', []));

          // NEW STATE: REPORT
          const [showReport, setShowReport] = useState(false);

          const [isSaved, setIsSaved] = useState(true);

          useEffect(() => {
            setIsSaved(false);
            const timer = setTimeout(() => {
              localStorage.setItem(STORAGE_KEY + '_programName', JSON.stringify(programName));
              localStorage.setItem(STORAGE_KEY + '_intervenantName', JSON.stringify(intervenantName));
              localStorage.setItem(STORAGE_KEY + '_participantCount', JSON.stringify(participantCount));
              localStorage.setItem(STORAGE_KEY + '_startDate', JSON.stringify(startDate));
              localStorage.setItem(STORAGE_KEY + '_schedule', JSON.stringify(schedule));
              localStorage.setItem(STORAGE_KEY + '_scheduleChanges', JSON.stringify(scheduleChanges));
              localStorage.setItem(STORAGE_KEY + '_stages', JSON.stringify(stages));
              localStorage.setItem(STORAGE_KEY + '_constraints', JSON.stringify(constraints));
              localStorage.setItem(STORAGE_KEY + '_marginPercent', JSON.stringify(marginPercent));
              localStorage.setItem(STORAGE_KEY + '_participantEvents', JSON.stringify(participantEvents));
              localStorage.setItem(STORAGE_KEY + '_participants', JSON.stringify(participants));
              setIsSaved(true);
            }, 500);
            return () => clearTimeout(timer);
          }, [programName, intervenantName, participantCount, startDate, schedule, scheduleChanges, stages, constraints, marginPercent, participantEvents, participants]);

          // Sync participant count with active list if list is used
          useEffect(() => {
              if (participants.length > 0) {
                  const activeCount = participants.filter(p => p.status === 'active').length;
                  if (activeCount > 0 && activeCount !== participantCount) {
                      setParticipantCount(activeCount);
                  }
              }
          }, [participants]);

          const calculatedTimeline = useMemo(() => {
            return calculateTimeline(startDate, stages, constraints, schedule, participantCount, participantEvents, scheduleChanges);
          }, [startDate, stages, constraints, schedule, participantCount, participantEvents, scheduleChanges]);

          const totalSessions = calculatedTimeline.filter(s => s.type === 'work').reduce((acc, s) => acc + (s.effectiveWorkDays || 0), 0);
          const finishDate = calculatedTimeline.length > 0 ? calculatedTimeline[calculatedTimeline.length - 1].endDate : parseDate(startDate);
          const startObj = parseDate(startDate);
          let totalDurationDays = 0;
          if (!isNaN(startObj.getTime()) && !isNaN(finishDate.getTime())) totalDurationDays = Math.ceil((finishDate.getTime() - startObj.getTime()) / (1000 * 3600 * 24));
          const safeDate = addDays(finishDate, Math.ceil(totalDurationDays * (marginPercent / 100)));

          const handleApplyTemplate = () => {
             if (window.confirm("Attention : Appliquer ce modèle remplacera toutes les étapes actuelles. Continuer ?")) {
                 const tpl = PROGRAM_TEMPLATES.find(t => t.id === selectedTemplate);
                 if (tpl) {
                     setProgramName(tpl.defaultName);
                     setParticipantCount(tpl.defaultParticipants);
                     // Generate new IDs to avoid key conflicts
                     const newStages = tpl.stages.map(s => ({ ...s, id: crypto.randomUUID() }));
                     setStages(newStages);
                 }
             }
          };

          const handleReset = () => {
            if (window.confirm("Tout réinitialiser ?")) {
              const keys = ['programName', 'intervenantName', 'participantCount', 'startDate', 'schedule', 'scheduleChanges', 'stages', 'constraints', 'marginPercent', 'participantEvents', 'participants'];
              keys.forEach(k => localStorage.removeItem(STORAGE_KEY + '_' + k));
              window.location.reload();
            }
          };

          const handleExportJSON = () => {
            const data = { programName, intervenantName, participantCount, startDate, schedule, scheduleChanges, stages, constraints, marginPercent, participantEvents, participants, version: "5.8" };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `config_chrono_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
          };

          const handleImportClick = () => fileInputRef.current?.click();
          const handleFileChange = (e) => {
            const file = e.target.files?.[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
              try {
                const data = JSON.parse(event.target.result);
                if (data.programName) setProgramName(data.programName);
                if (data.participantCount) setParticipantCount(data.participantCount);
                if (data.stages) setStages(data.stages.map(s => ({ ...s, phase: s.phase || 'pendant', calcMode: s.calcMode || 'fixed' })));
                if (data.schedule) setSchedule(data.schedule);
                if (data.scheduleChanges) setScheduleChanges(data.scheduleChanges);
                if (data.constraints) setConstraints(data.constraints);
                if (data.participantEvents) setParticipantEvents(data.participantEvents);
                if (data.participants) setParticipants(data.participants);
                alert("Configuration chargée !");
              } catch (err) { alert("Erreur fichier."); }
            };
            reader.readAsText(file); e.target.value = '';
          };

          const handleExportCSV = () => {
             let csvContent = "data:text/csv;charset=utf-8,Phase,Type,Mode,Étape,Description,Durée,Participants Actifs,Date Début,Date Fin,Tâches Admin\n";
             calculatedTimeline.forEach(s => {
               const adminSummary = s.adminTasks ? s.adminTasks.map(t => `${t.label}`).join('; ') : '';
               csvContent += `${s.phase},${s.type},${s.schedulingMode},"${s.name}","${s.description}",${s.effectiveWorkDays}j,${s.usedParticipantCount},${formatDateShort(s.startDate)},${formatDateShort(s.endDate)},"${adminSummary}"\n`;
             });
             const link = document.createElement("a"); link.setAttribute("href", encodeURI(csvContent)); link.setAttribute("download", "export.csv"); document.body.appendChild(link); link.click(); document.body.removeChild(link);
          };

          return (
            <div className="min-h-screen bg-slate-100 pb-20 print:bg-white print:pb-0 font-sans">
              <div className="fixed inset-0 z-[-1] bg-[radial-gradient(#e2e8f0_1px,transparent_1px)] [background-size:20px_20px] opacity-40 pointer-events-none"></div>
              <input type="file" ref={fileInputRef} onChange={handleFileChange} className="hidden" accept=".json" />

              {/* Management Report Modal */}
              {showReport && (
                <ManagementReport
                  onClose={() => setShowReport(false)}
                  data={{ programName, startDate, calculatedTimeline, participants, participantEvents, constraints, marginPercent }}
                />
              )}

              <header className="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40 print:hidden shadow-sm">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="bg-gradient-to-tr from-blue-700 to-blue-600 p-2 rounded-lg shadow-md shadow-blue-500/20"><Clock className="text-white w-6 h-6" /></div>
                    <div><h1 className="text-xl font-bold text-slate-800 leading-none">ChronoSuivi</h1><p className="text-[10px] uppercase font-bold text-blue-500 tracking-wider mt-0.5">Gestion de délais</p></div>
                  </div>
                  <div className="flex items-center gap-3">
                    <span className={`hidden md:flex text-xs font-bold items-center gap-1.5 px-3 py-1.5 rounded-full ${isSaved ? 'text-green-700 bg-green-50 border border-green-100' : 'text-amber-700 bg-amber-50 border border-amber-100'}`}><span className={`w-2 h-2 rounded-full ${isSaved ? 'bg-green-500' : 'bg-amber-500 animate-pulse'}`}></span>{isSaved ? 'Enregistré' : '...'}</span>
                    <div className="h-8 w-px bg-slate-200 mx-1 hidden sm:block"></div>
                    <div className="flex gap-2">
                       <button onClick={() => setShowReport(true)} className="p-2 hover:bg-slate-100 text-slate-600 rounded-lg transition-all" title="Rapport de Gestion"><FileText className="w-5 h-5 text-blue-600" /></button>
                       <button onClick={handleImportClick} className="p-2 hover:bg-slate-100 text-slate-600 rounded-lg transition-all" title="Importer"><Upload className="w-5 h-5" /></button>
                       <button onClick={handleExportJSON} className="p-2 hover:bg-slate-100 text-slate-600 rounded-lg transition-all" title="Sauvegarder"><FileJson className="w-5 h-5" /></button>
                       <button onClick={handleExportCSV} className="p-2 hover:bg-slate-100 text-slate-600 rounded-lg transition-all" title="Excel"><FileSpreadsheet className="w-5 h-5" /></button>
                       <button onClick={() => window.print()} className="p-2 hover:bg-blue-50 text-blue-600 rounded-lg transition-all" title="Imprimer"><Printer className="w-5 h-5" /></button>
                    </div>
                    <button onClick={handleReset} className="ml-2 text-slate-400 hover:text-red-600 p-2 rounded-lg transition-colors hover:bg-red-50"><RotateCcw className="w-5 h-5" /></button>
                  </div>
                </div>
              </header>

              <main className="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-8">
                {/* DASHBOARD */}
                <div className="grid grid-cols-1 md:grid-cols-12 gap-6 print:hidden">
                  <div className="md:col-span-8 bg-gradient-to-br from-blue-700 via-blue-600 to-indigo-700 rounded-2xl p-8 text-white shadow-xl shadow-blue-900/20 relative overflow-hidden group hover:shadow-2xl transition-all duration-300">
                    <div className="absolute -top-10 -right-10 p-10 opacity-10 group-hover:opacity-20 transition-opacity transform group-hover:rotate-12 duration-700"><CalendarRange className="w-64 h-64" /></div>
                    <div className="relative z-10 flex flex-col justify-between h-full">
                      <div><p className="text-blue-100 text-sm font-bold uppercase tracking-widest mb-1 opacity-80">Fin Optimale Estimée</p><h2 className="text-5xl sm:text-6xl font-extrabold tracking-tight mb-8 text-white drop-shadow-sm">{formatDateFr(finishDate)}</h2></div>
                      <div className="flex flex-wrap items-center gap-4">
                          <div className="bg-white/10 backdrop-blur-md px-5 py-3 rounded-xl border border-white/10 flex items-center gap-4 hover:bg-white/20 transition-colors">
                            <div className="bg-white/20 p-2.5 rounded-lg"><ArrowRight className="w-5 h-5 text-white" /></div>
                            <div><p className="text-[10px] text-blue-100 font-bold uppercase tracking-wider">Durée Totale</p><p className="text-xl font-bold">{totalDurationDays} jours</p></div>
                          </div>
                          <div className="bg-white/10 backdrop-blur-md px-5 py-3 rounded-xl border border-white/10 flex items-center gap-4 hover:bg-white/20 transition-colors">
                            <div className="bg-white/20 p-2.5 rounded-lg"><Shield className="w-5 h-5 text-white" /></div>
                            <div><p className="text-[10px] text-blue-100 font-bold uppercase tracking-wider">Sécurité (+{marginPercent}%)</p><p className="text-xl font-bold">{formatDateFr(safeDate)}</p></div>
                          </div>
                      </div>
                    </div>
                  </div>
                  <div className="md:col-span-4 flex flex-col gap-4">
                    <div className="flex-1 bg-white rounded-2xl p-6 border border-slate-100 shadow-sm flex flex-col justify-center group hover:border-blue-200 transition-colors">
                        <div className="flex items-center justify-between mb-4">
                          <div className="flex items-center gap-4"><div className="p-3 bg-blue-50 text-blue-600 rounded-xl group-hover:bg-blue-600 group-hover:text-white transition-all"><Layers className="w-6 h-6" /></div><span className="text-slate-500 text-xs font-bold uppercase tracking-wider">Jours de Travail</span></div>
                          <span className="text-4xl font-bold text-slate-800">{totalSessions}</span>
                        </div>
                        <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden"><div className="bg-blue-500 h-full rounded-full" style={{ width: '100%' }}></div></div>
                        <p className="text-right text-xs text-slate-400 mt-2 font-medium">Jours ouvrés requis</p>
                    </div>
                    <div className="flex-1 bg-white rounded-2xl p-6 border border-slate-100 shadow-sm flex flex-col justify-center group hover:border-amber-200 transition-colors">
                        <div className="flex items-center justify-between mb-4">
                          <div className="flex items-center gap-4"><div className="p-3 bg-amber-50 text-amber-600 rounded-xl group-hover:bg-amber-500 group-hover:text-white transition-all"><AlertTriangle className="w-6 h-6" /></div><span className="text-slate-500 text-xs font-bold uppercase tracking-wider">Contraintes</span></div>
                          <span className="text-4xl font-bold text-slate-800">{constraints.length}</span>
                        </div>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                  <div className="lg:col-span-4 space-y-6">
                    <SectionCard title="Paramètres du Programme" icon={Settings}>
                      <div className="space-y-4">
                         {/* TEMPLATE SELECTOR */}
                         <div className="bg-blue-50 border border-blue-100 rounded-lg p-3 mb-2">
                             <label className="text-[10px] font-bold text-blue-700 uppercase tracking-wider mb-1 block flex items-center gap-1"><LayoutTemplate className="w-3 h-3" /> Modèle de Programme</label>
                             <div className="flex gap-2">
                                 <select
                                    value={selectedTemplate}
                                    onChange={(e) => setSelectedTemplate(e.target.value)}
                                    className="flex-1 text-xs border-slate-300 rounded focus:ring-blue-500 focus:border-blue-500"
                                 >
                                     {PROGRAM_TEMPLATES.map(tpl => (
                                         <option key={tpl.id} value={tpl.id}>{tpl.label}</option>
                                     ))}
                                 </select>
                                 <button
                                    onClick={handleApplyTemplate}
                                    className="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-1.5 rounded shadow-sm transition-colors"
                                 >
                                     Appliquer
                                 </button>
                             </div>
                         </div>

                        <div><label className="block text-xs font-semibold text-slate-500 mb-1">Nom du Programme</label><input type="text" value={programName} onChange={(e) => setProgramName(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-blue-500/50 outline-none" placeholder="Ex: Programme Alpha" /></div>
                        <div><label className="block text-xs font-semibold text-slate-500 mb-1">Date de démarrage</label><input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-blue-500/50 outline-none" /></div>
                        <div>
                          <label className="block text-xs font-semibold text-blue-600 mb-1">Nombre de Participants (Actifs)</label>
                          <div className="relative">
                            <Users className="absolute left-3 top-2.5 text-blue-400 w-4 h-4" />
                            <input type="number" min="1" value={participantCount} onChange={(e) => setParticipantCount(Math.max(1, parseInt(e.target.value) || 1))} className="w-full bg-blue-50 border border-blue-200 rounded-lg pl-9 pr-3 py-2 text-sm font-bold text-blue-900 focus:ring-2 focus:ring-blue-500 outline-none" />
                          </div>
                          <p className="text-[10px] text-slate-400 mt-1">Calculé automatiquement si des participants sont ajoutés.</p>
                        </div>
                        <div className="pt-2 border-t border-slate-100">
                           <div className="flex justify-between items-center mb-1"><label className="block text-xs font-semibold text-slate-500">Marge de sécurité</label><span className="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">{marginPercent}%</span></div>
                           <input type="range" min="0" max="50" step="5" value={marginPercent} onChange={(e) => setMarginPercent(parseInt(e.target.value))} className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer" />
                        </div>
                      </div>
                    </SectionCard>

                    <ParticipantManager participants={participants} setParticipants={setParticipants} onAddEvent={setParticipantEvents} />
                    <ParticipantEventManager events={participantEvents} setEvents={setParticipantEvents} participants={participants} />

                    <div className="print:hidden"><ScheduleManager schedule={schedule} setSchedule={setSchedule} /></div>
                    <div className="print:hidden"><ScheduleChangeManager changes={scheduleChanges} setChanges={setScheduleChanges} initialSchedule={schedule} /></div>

                    <StageBuilder stages={stages} setStages={setStages} participantCount={participantCount} />
                    <ConstraintManager constraints={constraints} setConstraints={setConstraints} />
                  </div>
                  <div className="lg:col-span-8">
                    <div className="print-only mb-6 hidden"><h1 className="text-2xl font-bold mb-2">{programName}</h1><p>Date de début : {formatDateFr(new Date(startDate))}</p><p>Participants : {participantCount}</p></div>
                    <Timeline calculatedStages={calculatedTimeline} />
                    <div className="mt-4 text-center print:hidden"><p className="text-xs text-slate-400">Le calcul exclut les jours non travaillés et les contraintes.</p></div>
                  </div>
                </div>
              </main>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
