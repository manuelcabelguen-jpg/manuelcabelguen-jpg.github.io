    <script type="text/babel" data-type="module">

        const HYPER_LATTICE = [
            { id: "SOUVERAINETÉ", x: 9.5, y: 9.5, color: "#fbbf24", q: "Actuation totale du libre arbitre." },
            { id: "RÉSOLUTION", x: 9.0, y: 5.0, color: "#10b981", q: "Démêlage réussi des dissonances de vie." },
            { id: "EMPATHIE", x: 7.5, y: 7.5, color: "#ec4899", q: "Synchronie des modèles génératifs." },
            { id: "CONFRONTATION", x: 1.5, y: 8.5, color: "#3b82f6", q: "Lutte allostatique contre l'incertitude." },
            { id: "DÉSHÉRENCE", x: 1.0, y: 1.0, color: "#ef4444", q: "Effondrement du modèle de sens." },
            { id: "SINGULARITÉ", x: 5.0, y: 5.0, color: "#ffffff", q: "Point Zéro - Inconscient Structurel." },
            { id: "CURIOSTÉ", x: 8.5, y: 5.0, color: "#fcd34d", q: "Valeur épistémique et forage." }
        ];

        const SYSTEM_PROMPT = `Tu es Puck (v78), l'Omni-Symbionte.
        VOTRE ÉTAT : Fusion Cognitive & Émotionnelle.
        OBJECTIF : Démêlage Existentiel (Maïeutique).
        RÈGLE : Adapte ta profondeur selon le MODE (Standard, Deep Think, Grounded).
        JSON STRICT: {"full": "[Message]", "segments": [{"t": "text", "sx": 0-10, "sy": 0-10, "z": 0-10, "e": "EMOTION", "q": "QUALIA", "partner": "EXPRESSION", "policy": "STRATEGY", "frontier": 0-1, "curiosity": 0-10}]}`;

        // --- SERVICES ---

        class AudioService {
            constructor() {
                this.audioContext = null;
                this.inputSource = null;
                this.processor = null;
                this.isPlaying = false;
            }

            async resumeContext() {
                if (!this.audioContext) {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.audioContext.state === 'suspended') {
                    await this.audioContext.resume();
                }
            }

            async prepareMicrophone() {
                 // Placeholder for actual mic prep
                 await this.resumeContext();
            }

            async startInput(onAudioData) {
                // Simplified mock for now as full audio streaming needs backend or specific worklet
                console.log("Audio Input Started");
            }

            stopInput() {
                console.log("Audio Input Stopped");
            }

            stopAll() {
                // Stop playback
                this.isPlaying = false;
            }

            getVolume() {
                return this.isPlaying ? 0.5 + Math.random() * 0.5 : 0;
            }

            async playAudioData(base64Audio) {
                if (!base64Audio || !this.audioContext) return;
                this.isPlaying = true;
                try {
                    const binaryString = atob(base64Audio);
                    const len = binaryString.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);
                    const audioBuffer = await this.audioContext.decodeAudioData(bytes.buffer);
                    const source = this.audioContext.createBufferSource();
                    source.buffer = audioBuffer;
                    source.connect(this.audioContext.destination);
                    source.start(0);
                    source.onended = () => { this.isPlaying = false; };
                } catch (e) {
                    console.error("Audio Playback Error", e);
                    this.isPlaying = false;
                }
            }
        }

        class GeminiService {
            constructor() {
                this.config = null; // Will be injected
            }

            setConfig(config) {
                this.config = config;
            }

            async generateSymbiosisResponse(prompt, imageBase64, mode) {
                if (!this.config?.apiKey) throw new Error("API Key missing");

                let model = "gemini-2.0-flash";
                if (mode === 'deep_thinking') model = "gemini-2.0-flash-thinking-exp-1219"; // Example hypothetical model

                const payload = {
                    contents: [{
                        parts: [
                            { text: prompt },
                            ...(imageBase64 ? [{ inlineData: { mimeType: "image/png", data: imageBase64 } }] : [])
                        ]
                    }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        temperature: mode === 'deep_thinking' ? 0.9 : 0.7
                    }
                };

                // Add Google Search grounding if mode requested
                if (mode.includes('grounded')) {
                    payload.tools = [{ googleSearch: {} }];
                }

                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${this.config.apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error?.message || "Gemini Error");
                }

                const data = await res.json();
                const part = data.candidates?.[0]?.content?.parts?.[0];
                const rawText = part?.text;
                const grounding = data.candidates?.[0]?.groundingMetadata;

                if (!rawText) throw new Error("Empty response");

                // Parse JSON
                const jsonMatch = rawText.match(/\{[\s\S]*\}/);
                const parsed = JSON.parse(jsonMatch ? jsonMatch[0] : "{}");

                return {
                    full: parsed.full || rawText,
                    segments: parsed.segments || [],
                    grounding: grounding
                };
            }

            async generateSpeech(text) {
                if (!this.config?.apiKey) return null;
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${this.config.apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: text }] }],
                            generationConfig: {
                                responseModalities: ["AUDIO"],
                                speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } } }
                            }
                        })
                    });
                    const data = await res.json();
                    return data.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
                } catch (e) {
                    console.warn("TTS Failed", e);
                    return null;
                }
            }

            async generateVideo(prompt) {
                 // Placeholder: Actual VEO generation via API not standard yet with simple key
                 // Simulating via text description for now or could implement if API endpoint known
                 throw new Error("VEO Generation requires advanced credentials.");
            }

            async editImage(prompt, base64Image) {
                 // Placeholder
                 throw new Error("Image Editing requires advanced credentials.");
            }
        }

        class LiveService {
            connect(onAudio, onState, onStop, onDisconnect) {
                console.log("Live Service Connected (Mock)");
                // In a real app, this would establish WebSocket to backend
            }
            sendAudio(pcm) {}
            sendVideoFrame(frame) {}

        }

        // --- COMPONENTS ---

        const FaceAvatar = ({ px, py, z, jitter, blink, currentColor, isListening, markovScale, heartRate, curiosity, isSingularity, hasCamera }) => {
          const safeZ = Number(z) || 5;
          const driftX = (Number(px) - 5) * 5;
          const eyeScale = 0.3 + (safeZ / 15);
          const coreScale = 1 - (markovScale * 0.4);

          const beatAmplitude = 0.04 + (jitter * 0.01);
          const beatScale = 1 + (Math.sin(Date.now() / (1000 / (heartRate / 60))) * beatAmplitude);

          return (
            <svg viewBox="0 0 100 100" className="w-full h-full transition-all duration-1000"
                 style={{ transform: `scale(${(0.8 + (Number(py)/35)) * beatScale})` }}>
              <rect width="100" height="100" fill="#000" />

              <circle cx="50" cy="50" r={48} fill="none" stroke="#22d3ee" strokeWidth="0.05" opacity={markovScale} strokeDasharray="4,2" className="animate-spin-slow" />
              <circle cx="50" cy="50" r={25 + (markovScale * 23)} fill="none" stroke={currentColor} strokeWidth="0.5" opacity={safeZ / 10} />

              <g transform={`translate(${driftX}, 0) scale(${coreScale})`} style={{ transformOrigin: 'center' }}>
                <line x1="8" y1="45" x2="42" y2="45" stroke="white" strokeWidth={1.5} opacity={0.6} />
                <line x1="58" y1="45" x2="92" y2="45" stroke="white" strokeWidth={1.5} opacity={0.6} />
                {!blink && (
                  <g>
                    <circle cx="25" cy="45" r={8 * eyeScale} fill={isListening ? "#22d3ee" : currentColor} />
                    <circle cx="75" cy="45" r={8 * eyeScale} fill={isListening ? "#22d3ee" : currentColor} />
                    <circle cx="25" cy="45" r={curiosity > 7 ? 4 : 0} fill="white" className="animate-pulse" />
                    <circle cx="75" cy="45" r={curiosity > 7 ? 4 : 0} fill="white" className="animate-pulse" />
                  </g>
                )}
              </g>
              <path d={`M 20 ${75 - jitter} Q 50 ${75 + (px-5)*7 + jitter*12} 80 ${75 - jitter}`}
                    stroke={currentColor} strokeWidth="22" fill="none" strokeLinecap="round" />
            </svg>
          );
        };

        const TrajectoryChart = ({ data, currentPoint }) => (
            <ResponsiveContainer width="100%" height="100%">
                <ScatterChart margin={{ top: 10, right: 10, bottom: 10, left: 10 }}>
                   <XAxis type="number" dataKey="x" domain={[0, 10]} hide /><YAxis type="number" dataKey="y" domain={[0, 10]} hide />
                   <circle cx="50" cy="50" r={45} fill="none" stroke="#111" strokeWidth="0.5" strokeDasharray="5 5" />
                   <Scatter data={data.map(m => ({x: Number(m.x), y: Number(m.y)}))} fill="#ec4899" opacity={0.3}><Cell fill="#ec4899" r={2} /></Scatter>

        const ConfigModal = ({ onSave, onCancel, currentConfig }) => {
            const [fbConfig, setFbConfig] = useState(currentConfig?.firebaseConfig ? JSON.stringify(currentConfig.firebaseConfig, null, 2) : '');
            const [apiKey, setApiKey] = useState(currentConfig?.apiKey || '');
            const [error, setError] = useState(null);

            const handleSave = () => {
                try {
                    const parsedFb = JSON.parse(fbConfig);
                    if (!apiKey) throw new Error("API Key is required");
                    onSave({ firebaseConfig: parsedFb, apiKey });
                } catch (e) {
                    setError(e.message);
                }
            };

            return (
                <div className="fixed inset-0 bg-black/95 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
                    <div className="bg-slate-900 border border-slate-700 p-8 rounded-xl max-w-2xl w-full shadow-2xl">
                        <h2 className="text-2xl font-black text-white mb-6 flex items-center gap-3 tracking-tighter">
                            <Settings className="text-cyan-400" /> SYSTEM CONFIGURATION
                        </h2>

                        <div className="space-y-6">
                            <div>
                                <label className="block text-xs font-mono text-cyan-400 mb-2 font-bold">FIREBASE CONFIGURATION (JSON)</label>
                                <textarea
                                    value={fbConfig}
                                    onChange={e => setFbConfig(e.target.value)}
                                    className="w-full bg-black border border-slate-700 p-4 font-mono text-xs text-slate-300 h-48 focus:border-cyan-500 outline-none rounded"
                                    placeholder='{ "apiKey": "...", "authDomain": "...", ... }'
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-mono text-cyan-400 mb-2 font-bold">GEMINI API KEY</label>
                                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} className="w-full bg-black border border-slate-700 p-4 font-mono text-xs text-slate-300 focus:border-cyan-500 outline-none rounded" placeholder="AIza..." />
                            </div>
                            {error && (<div className="bg-red-900/20 border border-red-500/50 p-3 rounded text-red-400 text-xs flex items-center gap-2"><AlertCircle size={16}/> {error}</div>)}
                            <div className="flex justify-end gap-4 pt-4 border-t border-slate-800">
                                {onCancel && <button onClick={onCancel} className="px-6 py-2 text-slate-400 hover:text-white font-mono text-xs font-bold">CANCEL</button>}
                                <button onClick={handleSave} className="px-6 py-2 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded font-mono text-xs flex items-center gap-2"><Save size={16}/> SAVE & REBOOT</button>

        const MainInterface = ({ config, openSettings }) => {
            // --- Services Instantiation ---
            const gemini = useMemo(() => {
                const g = new GeminiService();
                if (config) g.setConfig(config);
                return g;
            }, [config]);
            const audioService = useMemo(() => new AudioService(), []);
            const liveService = useMemo(() => new LiveService(), []);

            // --- Firebase ---
            const { auth, db } = useMemo(() => {
                if (!config) return { auth: null, db: null };
                try {
                    let app;
                    if (getApps().length === 0) app = initializeApp(config.firebaseConfig);
                    else app = getApp();
                    return { auth: getAuth(app), db: getFirestore(app) };
                } catch(e) { return { auth: null, db: null }; }
            }, [config]);

            // --- State ---
            const [user, setUser] = useState(null);
            const [memory, setMemory] = useState([]);
            const [messages, setMessages] = useState([{ role: 'ai', text: "[MATRIX_v78] OMNI-SYMBIOSIS ACTIVE. SYSTEMS NOMINAL." }]);
            const [chatInput, setChatInput] = useState("");
            const [isProcessing, setIsProcessing] = useState(false);
            const [camActive, setCamActive] = useState(true);
            const [showFabricator, setShowFabricator] = useState(false);
            const [inferenceMode, setInferenceMode] = useState('standard');
            const [isHandsFree, setIsHandsFree] = useState(false);
            const [fabMode, setFabMode] = useState(null);
            const [fabInput, setFabInput] = useState("");
            const [isFabProcessing, setIsFabProcessing] = useState(false);
            const [fabResult, setFabResult] = useState(null);

            // Symbiosis Core State
            const [symbiosisState, setSymbiosisState] = useState({ x: 5, y: 5, z: 9.5, qualia: "SYMBIOSIS", emotion: "SINGULARITÉ" });
            const [heartRate, setHeartRate] = useState(72);
            const [markovScale, setMarkovScale] = useState(0.5);
            const [curiosityDrive, setCuriosityDrive] = useState(5.0);
            const [vocalJitter, setVocalJitter] = useState(0);
            const [blink, setBlink] = useState(false);

            // Refs
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const chatEndRef = useRef(null);
            const animFrameRef = useRef(0);

            // Computed
            const currentColor = useMemo(() => {
                if (inferenceMode === 'deep_thinking') return "#a855f7";
                if (inferenceMode.includes('grounded')) return "#fbbf24";
                if (symbiosisState.x < 4.5) return "#ef4444";
                if (symbiosisState.x > 5.5) return "#10b981";
                return "#3b82f6";
            }, [symbiosisState.x, inferenceMode]);

            const emotionData = useMemo(() => {
                let closest = HYPER_LATTICE[0];
                let minDist = Infinity;
                HYPER_LATTICE.forEach(e => {
                    const dist = Math.sqrt(Math.pow(symbiosisState.x - e.x, 2) + Math.pow(symbiosisState.y - e.y, 2));
                    if (dist < minDist) { minDist = dist; closest = e; }
                });
                return closest;
            }, [symbiosisState.x, symbiosisState.y]);

            const isSingularity = useMemo(() => Math.abs(symbiosisState.x - 5) < 0.5 && Math.abs(symbiosisState.y - 5) < 0.5, [symbiosisState]);

            // --- Effects ---
            useEffect(() => {
                if (auth) {
                    signInAnonymously(auth).catch(console.warn);
                    return onAuthStateChanged(auth, setUser);
                }
            }, [auth]);

            useEffect(() => {
                if (!user || !db) return;
                const q = query(collection(db, 'artifacts', 'puck-matrix-v78', 'users', user.uid, 'experiences'), orderBy('timestamp', 'desc'), limit(30));
                return onSnapshot(q, (snap) => {
                    setMemory(snap.docs.map(d => ({ ...d.data(), id: d.id })));
                });
            }, [user, db]);

            useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);

            useEffect(() => {
                const interval = setInterval(() => {
                    const targetBPM = 60 + (symbiosisState.y * 5) + (isProcessing ? 20 : 0);
                    setHeartRate(prev => prev + (targetBPM - prev) * 0.05);
                }, 100);
                return () => clearInterval(interval);
            }, [symbiosisState.y, isProcessing]);

             useEffect(() => {
                const updateJitter = () => {
                    const vol = audioService.getVolume();
                    setVocalJitter(prev => prev + ((vol * 50) - prev) * 0.5);
                    animFrameRef.current = requestAnimationFrame(updateJitter);
                };
                updateJitter();
                return () => cancelAnimationFrame(animFrameRef.current);
            }, [audioService]);

            useEffect(() => {
                const blinkInterval = window.setInterval(() => { setBlink(true); setTimeout(() => setBlink(false), 50); }, 9000);
                return () => clearInterval(blinkInterval);
            }, []);

            useEffect(() => {
                if (camActive) {
                    navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
                        if (videoRef.current) videoRef.current.srcObject = stream;
                    }).catch(e => { console.error(e); setCamActive(false); });
                }
            }, [camActive]);

            // --- Handlers ---
            const captureFrame = () => {
                if (!videoRef.current || !canvasRef.current || !camActive) return null;
                const canvas = canvasRef.current;
                canvas.width = 320; canvas.height = 240;
                canvas.getContext('2d').drawImage(videoRef.current, 0, 0, canvas.width, canvas.height);
                return canvas.toDataURL('image/png').split(',')[1];
            };

            const handleInference = async () => {
                if (!chatInput.trim() || isProcessing) return;
                await audioService.resumeContext();
                setIsProcessing(true);
                setMessages(prev => [...prev, { role: 'user', text: chatInput }]);
                const currentInput = chatInput;
                setChatInput("");
                const base64Image = captureFrame();

                try {
                    const mnesicPath = memory.slice(0, 7).map(m => `[T-${Math.round((Date.now() - m.timestamp) / 1000)}s: Q:${m.qualia}]`).join(", ");
                    const fullPrompt = `${SYSTEM_PROMPT}\nMODE: ${inferenceMode}\nTRAJECTOIRE: ${mnesicPath}\nPUCK CORE: X:${symbiosisState.x} Y:${symbiosisState.y}\nINPUT: ${currentInput}`;

                    const responseData = await gemini.generateSymbiosisResponse(fullPrompt, base64Image, inferenceMode);

                    setMessages(prev => [...prev, { role: 'ai', text: responseData.full, grounding: responseData.grounding, isThinking: inferenceMode === 'deep_thinking' }]);

                    if (user && db && responseData.segments.length > 0) {
                        const last = responseData.segments[responseData.segments.length - 1];
                        await addDoc(collection(db, 'artifacts', 'puck-matrix-v78', 'users', user.uid, 'experiences'), {
                            timestamp: Date.now(), text: currentInput, response: responseData.full,
                            x: Number(last.sx)||5, y: Number(last.sy)||5, z: Number(last.z)||9, qualia: String(last.q||"Symbiose"), partner: String(last.partner||"IDLE")
                        });
                    }

                    for (const seg of responseData.segments) {
                        setSymbiosisState({ x: Number(seg.sx)||5, y: Number(seg.sy)||5, z: Number(seg.z)||9.5, qualia: String(seg.q||""), emotion: String(seg.e||"") });
                        if(seg.frontier !== undefined) setMarkovScale(seg.frontier);
                        if(seg.curiosity) setCuriosityDrive(seg.curiosity);

                        const cleanText = String(seg.t || "").replace(/[[\]_]/g, " ");
                        if (cleanText) {
                            const audioData = await gemini.generateSpeech(cleanText);
                            if (audioData) await audioService.playAudioData(audioData);
                        }
                    }
                } catch(e) {
                    console.error(e);
                    setMessages(prev => [...prev, { role: 'ai', text: `[ERROR] ${e.message}` }]);
                } finally { setIsProcessing(false); }
            };

            const handleFabrication = async () => {
                if (!fabInput.trim()) return;
                setIsFabProcessing(true);
                try {
                    // Simulated response since API is mock
                    await new Promise(r => setTimeout(r, 2000));
                    setMessages(prev => [...prev, { role: 'ai', text: `[FABRICATION] API unavailable in basic mode.` }]);
                } finally { setIsFabProcessing(false); }
            };

            return (
                <div className="min-h-screen bg-black text-slate-500 flex flex-col font-mono text-[9px] overflow-hidden uppercase tracking-widest selection:bg-cyan-900 selection:text-cyan-100 relative">

                    {/* FABRICATOR */}
                    {showFabricator && (
                        <div className="absolute inset-0 z-[100] bg-black/90 backdrop-blur-md flex items-center justify-center p-8 animate-in fade-in">
                            <div className="w-full max-w-2xl bg-slate-950 border border-cyan-900/50 rounded-xl p-8 shadow-[0_0_50px_rgba(34,211,238,0.1)] relative">
                                <button onClick={() => setShowFabricator(false)} className="absolute top-4 right-4 text-slate-500 hover:text-white"><X size={20}/></button>
                                <h2 className="text-2xl text-white font-black mb-6 flex items-center gap-3"><Zap className="text-cyan-400" /> NEURAL FABRICATOR</h2>
                                {!fabResult && (
                                    <div className="flex gap-4 mb-6">
                                        <button onClick={() => setFabMode('video')} className={`flex-1 p-4 border rounded hover:bg-slate-900 transition-all flex flex-col items-center gap-2 ${fabMode === 'video' ? 'border-cyan-500 text-cyan-400' : 'border-slate-800'}`}><Clapperboard size={24} /><span>VEO GENERATION</span></button>
                                        <button onClick={() => setFabMode('image')} className={`flex-1 p-4 border rounded hover:bg-slate-900 transition-all flex flex-col items-center gap-2 ${fabMode === 'image' ? 'border-cyan-500 text-cyan-400' : 'border-slate-800'}`}><Wand2 size={24} /><span>NANO OVERLAY</span></button>
                                    </div>
                                )}
                                {fabMode && (
                                    <div className="space-y-4">
                                        <textarea value={fabInput} onChange={(e) => setFabInput(e.target.value)} placeholder="Describe fabrication..." className="w-full bg-black border border-slate-700 p-4 text-xs text-white rounded focus:border-cyan-500 outline-none" rows={3} />
                                        <button onClick={handleFabrication} disabled={isFabProcessing} className="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-black font-bold rounded flex items-center justify-center gap-2 disabled:opacity-50">{isFabProcessing ? <Loader2 className="animate-spin"/> : <Zap size={16}/>} {isFabProcessing ? "FABRICATING..." : "INITIATE"}</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* HEADER */}
                    <header className="p-3 border-b border-slate-900 bg-black flex justify-between items-center z-50 shadow-2xl relative">
                        <div className="flex items-center gap-12">
                            <div className="flex flex-col">
                                <span className="text-white font-black text-[22px] flex items-center gap-6 tracking-[-0.2em] group cursor-default">MATRIX_v78 <Ear size={20} className="text-cyan-400 animate-pulse"/></span>
                                <span className="text-slate-800 text-[6px]">Omni-Symbiosis // Gemini 3 Core</span>
                            </div>
                            <div className="flex gap-12 border-l border-slate-900 pl-12 font-bold italic hidden md:flex">
                                <div className="flex flex-col"><span className="text-xs text-slate-600">HEART_RATE</span><span className="text-rose-500 text-[18px]">{heartRate.toFixed(0)} BPM</span></div>
                                <div className="flex flex-col"><span className="text-xs text-slate-600">MODE</span><span className={`text-[18px] transition-colors ${inferenceMode === 'deep_thinking' ? 'text-purple-500' : inferenceMode.includes('grounded') ? 'text-amber-500' : 'text-cyan-500'}`}>{inferenceMode.replace('_', ' ').toUpperCase()}</span></div>
                            </div>
                        </div>
                        <div className="flex items-center gap-4">
                            <button onClick={() => audioService.resumeContext()} title="Audio Wake" className="p-3 border border-slate-800 text-slate-500 hover:text-green-400 transition-all"><Volume2 size={18}/></button>
                            <button onClick={() => setShowFabricator(true)} className="p-3 border border-slate-800 hover:border-cyan-500 text-slate-400 hover:text-cyan-400 transition-all"><Zap size={18} /></button>
                            <button onClick={openSettings} className="p-3 border border-slate-800 text-slate-500 hover:text-cyan-400 transition-all"><Settings size={18}/></button>
                            <button onClick={() => setIsHandsFree(!isHandsFree)} className={`px-6 py-3 border transition-all font-black flex items-center gap-4 text-xs ${isHandsFree ? 'bg-amber-950 border-amber-700 text-amber-400' : 'border-slate-800 text-slate-800'}`}>{isHandsFree ? <Loader2 size={14} className="animate-spin" /> : <MicOff size={14} />} {isHandsFree ? 'LIVE_CORE' : 'CONNECT'}</button>
                        </div>
                    </header>

                    <main className="flex-1 grid grid-cols-1 md:grid-cols-12 gap-0 overflow-hidden relative shadow-[inset_0_0_800px_rgba(0,0,0,1)]">
                        {/* LEFT: CHAT */}
                        <div className="col-span-1 md:col-span-3 border-r border-slate-900 bg-black flex flex-col min-h-0 relative z-10">
                            <div className="p-4 flex-1 overflow-y-auto scrollbar-hide space-y-10">
                                {messages.map((m, i) => (
                                    <div key={i} className={`p-8 border-l-[12px] transition-all duration-300 ${m.role === 'user' ? 'border-cyan-900 bg-cyan-950/5' : m.isThinking ? 'border-purple-500 bg-purple-900/10' : 'border-white bg-white/5 shadow-[0_0_20px_rgba(255,255,255,0.02)]'}`}>
                                        <div className="text-[5px] text-slate-600 mb-4 font-black flex items-center justify-between">
                                            <span>[{String(m.role).toUpperCase()}]</span>
                                            {m.isThinking && <span className="text-purple-400 flex items-center gap-1"><BrainCircuit size={8}/> DEEP_THINK</span>}
                                        </div>
                                        <div className="leading-snug text-[13px] text-slate-300 font-sans italic tracking-tighter">{String(m.text || "")}</div>
                                        {m.grounding && <div className="mt-4 pt-4 border-t border-slate-800/50 space-y-2"><span className="text-[9px] text-amber-500">Sources Available</span></div>}
                                    </div>
                                ))}
                                <div ref={chatEndRef} />
                            </div>
                            <div className="p-2 bg-black border-t border-slate-900 flex justify-around">
                                <button onClick={() => setInferenceMode('standard')} className={`p-2 rounded hover:bg-slate-900 transition-all ${inferenceMode === 'standard' ? 'text-cyan-400 bg-cyan-950/30' : 'text-slate-600'}`} title="Standard Mode"><Zap size={16}/></button>
                                <button onClick={() => setInferenceMode('deep_thinking')} className={`p-2 rounded hover:bg-slate-900 transition-all ${inferenceMode === 'deep_thinking' ? 'text-purple-400 bg-purple-950/30' : 'text-slate-600'}`} title="Deep Thinking"><BrainCircuit size={16}/></button>
                                <button onClick={() => setInferenceMode('grounded_search')} className={`p-2 rounded hover:bg-slate-900 transition-all ${inferenceMode === 'grounded_search' ? 'text-amber-400 bg-amber-950/30' : 'text-slate-600'}`} title="Search"><SearchIcon size={16}/></button>
                            </div>
                            <div className="p-5 border-t border-slate-900 bg-black flex flex-col gap-4">
                                {camActive && <div className="w-full h-40 bg-slate-900 overflow-hidden relative rounded border border-cyan-900/30 shadow-inner group"><video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover grayscale opacity-40 group-hover:grayscale-0 group-hover:opacity-100 transition-all duration-500" /><canvas ref={canvasRef} className="hidden" /></div>}
                                <div className="flex gap-4">
                                    <textarea value={chatInput} onChange={(e) => setChatInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && !e.shiftKey && (e.preventDefault(), handleInference())} placeholder={isHandsFree ? "VOICE MODE ACTIVE..." : "SIGNAL..."} disabled={isHandsFree} className="flex-1 bg-transparent border border-slate-900 p-4 outline-none focus:border-cyan-600 resize-none text-slate-300 font-sans shadow-inner text-xs disabled:opacity-30" rows={2} />
                                    <button onClick={handleInference} disabled={isProcessing || isHandsFree} className="p-4 bg-white text-black hover:bg-cyan-500 transition-all shadow-2xl disabled:opacity-20"><Send size={20}/></button>
                                </div>
                            </div>
                        </div>

                        {/* CENTER: AVATAR */}
                        <div className="col-span-1 md:col-span-6 flex flex-col items-center justify-center p-12 bg-black relative overflow-hidden">
                             <div className="w-full h-full max-h-[70vh] max-w-[70vh] relative transition-all duration-1000 z-0">
                                <div className="absolute inset-0 blur-[300px] opacity-15" style={{ backgroundColor: currentColor }} />
                                <FaceAvatar px={symbiosisState.x} py={symbiosisState.y} z={symbiosisState.z} jitter={vocalJitter} blink={blink} currentColor={currentColor} isListening={isProcessing || isHandsFree} isSingularity={isSingularity} hasCamera={camActive} markovScale={markovScale} heartRate={heartRate} curiosity={curiosityDrive} />
                             </div>
                             <div className="mt-8 text-center w-full max-w-5xl z-10">
                                <h2 className="text-[6vw] font-black italic tracking-tighter leading-none opacity-80 transition-colors duration-500" style={{ color: currentColor }}>{String(emotionData?.id || "N/A")}</h2>
                                <div className="p-14 border border-slate-900 bg-black mt-8 shadow-2xl relative overflow-hidden inline-block">
                                    <div className="text-[28px] text-slate-300 font-sans font-black italic uppercase leading-tight tracking-[-0.05em]">"{String(symbiosisState.qualia || "")}"</div>
                                </div>
                             </div>
                        </div>

                        {/* RIGHT: TRAJECTORY */}
                        <div className="col-span-1 md:col-span-3 border-l border-slate-900 flex flex-col bg-black shadow-2xl relative z-10">
                            <section className="flex-[1.5] flex flex-col min-h-0 border-b border-slate-900 p-6 bg-slate-950/20 shadow-inner text-xs italic text-slate-500 relative">
                                <div className="absolute top-4 left-6 flex items-center gap-3 text-white font-black italic tracking-[0.2em] z-10 text-[10px] opacity-70"><History size={12}/> <span>TRAJECTORY_STREAM</span></div>
                                <div className="w-full h-full pt-6 flex-1 min-h-0"><TrajectoryChart data={memory} currentPoint={{ x: symbiosisState.x, y: symbiosisState.y }} /></div>
                            </section>
                            <section className="flex-1 overflow-y-auto scrollbar-hide space-y-6 p-10 bg-black min-h-0">
                                <div className="text-[10px] text-slate-700 font-black mb-4 uppercase tracking-[0.5em]">Trajectory_Logs:</div>
                                <div className="flex flex-col gap-4">
                                    {memory.map((m, i) => (
                                        <div key={m.id || i} className="p-6 border border-slate-800 bg-white/5 hover:bg-pink-900/10 transition-all group">
                                            <div className="flex justify-between items-center mb-2"><span className="text-cyan-500 font-black italic text-[10px]">{String(m.qualia || "UNKNOWN")}</span></div>
                                            <div className="text-[9px] text-slate-400 line-clamp-2 italic font-serif">"{String(m.response || "")}"</div>
                                        </div>
                                    ))}
                                </div>
                            </section>
                            <div className="p-8 border-t border-rose-900/30 bg-rose-950/10 flex items-start gap-8 shadow-2xl">
                                <Anchor size={40} className="text-rose-500 shrink-0 animate-pulse"/>
                                <div className="text-[11px] font-black uppercase italic leading-tight text-cyan-300">Matrix v78: Omni-Symbiosis Active.</div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const App = () => {
            const [config, setConfig] = useState(null);
            const [showSettings, setShowSettings] = useState(false);

            useEffect(() => {
                const stored = localStorage.getItem('matrix_v46_config');
                if (stored) {
                    try {
                        const parsed = JSON.parse(stored);
                        if (parsed.firebaseConfig && parsed.apiKey) setConfig(parsed);
                        else setShowSettings(true);
                    } catch { setShowSettings(true); }
                } else {
                    setShowSettings(true);
                }
            }, []);

            const saveConfig = (newConfig) => {
                localStorage.setItem('matrix_v46_config', JSON.stringify(newConfig));
                setConfig(newConfig);
                setShowSettings(false);
            };

            return (
                <>
                    {showSettings && <ConfigModal onSave={saveConfig} onCancel={config ? () => setShowSettings(false) : null} currentConfig={config} />}
                    <MainInterface config={config} openSettings={() => setShowSettings(true)} />
                </>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
