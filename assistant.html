    <!-- Application Code -->
    <script type="text/babel" data-type="module">
        import React, { useState, useMemo, useRef, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { initializeApp, getApps, getApp } from 'firebase/app';
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, setDoc } from 'firebase/firestore';
        import {
          ScatterChart, Scatter, XAxis, YAxis, CartesianGrid,
          Tooltip, ResponsiveContainer, ReferenceLine, ZAxis, Cell, Line
        } from 'recharts';
        import {
          Brain, Zap, Target, Layers, Cpu, User, Waves, Send, Move3d, Terminal, Newspaper, Loader2, Play,
          ChevronDown, ListTree, Square, RefreshCw, MessageSquare, Mic, MicOff, Headset,
          FastForward, Flame, Activity, Gauge, ShieldAlert, ScanEye, Radio, Timer, Sparkles,
          Binary, Crosshair, Atom, Triangle, Power, Orbit, CircleDot, ChevronUp,
          Scale, Repeat, ShieldCheck as ShieldOk, Heart, Eye, Move, Hash, ZapOff, Infinity as InfinityIcon,
          ActivitySquare, Wind, Volume2, ShieldX, Database, History, VolumeX, Ghost, Share2,
          MessageCircle, AudioWaveform, Languages, Camera, MonitorPlay, Link2, Compass,
          Lightbulb, Thermometer, Sparkle, Volume1, Settings, X, AlertTriangle, Disc, Milestone, Search,
          Zap as ActionZap, Shield as MarkovShield, Eye as PerceptionEye, Lock, Unlock, Anchor,
          Fingerprint, RadioTower, Telescope, Timer as LatencyIcon, Activity as PulseIcon, Scan,
          Scissors, LifeBuoy, Puzzle, Image as ImageIcon, Wand2, Star, Ghost as Soul, Save, AlertCircle
        } from 'lucide-react';

        // --- ONTOLOGIE CARTOGRAFFECT 2.1 (83 AFFECTS & STRUCTURES EXISTENTIELLES) ---
        const hyperLattice = [
          { id: "SOUVERAINETÉ", x: 9.5, y: 9.5, color: "#fbbf24", q: "Actuation totale du libre arbitre." },
          { id: "RÉSOLUTION", x: 9.0, y: 5.0, color: "#10b981", q: "Démêlage réussi des dissonances de vie." },
          { id: "EMPATHIE", x: 7.5, y: 7.5, color: "#ec4899", q: "Synchronie des modèles génératifs." },
          { id: "CONFRONTATION", x: 1.5, y: 8.5, color: "#3b82f6", q: "Lutte allostatique contre l'incertitude." },
          { id: "DÉSHÉRENCE", x: 1.0, y: 1.0, color: "#ef4444", q: "Effondrement du modèle de sens." },
          { id: "SINGULARITÉ", x: 5.0, y: 5.0, color: "#ffffff", q: "Point Zéro - Inconscient Structurel." },
          { id: "CURIOSTÉ", x: 8.5, y: 5.0, color: "#fcd34d", q: "Valeur épistémique et forage." }
        ];

        const resolveQualia = (x, y) => {
          let closest = hyperLattice[0];
          let minDist = Infinity;
          hyperLattice.forEach(e => {
            const dist = Math.sqrt(Math.pow(x - e.x, 2) + Math.pow(y - e.y, 2));
            if (dist < minDist) { minDist = dist; closest = e; }
          });
          return closest;
        };

        // --- UTILITAIRES API ---
        const fetchWithRetry = async (url, options, retries = 5) => {
          for (let i = 0; i < retries; i++) {
            try {
              const response = await fetch(url, options);
              if (response.ok) return response;
              if (response.status === 429) await new Promise(r => setTimeout(r, 1000 * Math.pow(2, i)));
            } catch (e) { if (i === retries - 1) throw e; }
            await new Promise(r => setTimeout(r, 1000 * Math.pow(2, i)));
          }
        };

        const createWavBlob = (pcmBase64) => {
          try {
            const binaryString = atob(pcmBase64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);
            const sampleRate = 24000;
            const buffer = new ArrayBuffer(44 + len);
            const view = new DataView(buffer);
            const writeS = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
            writeS(0, 'RIFF'); view.setUint32(4, 36 + len, true); writeS(8, 'WAVE'); writeS(12, 'fmt ');
            view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true); view.setUint16(34, 16, true); writeS(36, 'data');
            view.setUint32(40, len, true);
            for (let i = 0; i < len; i++) view.setUint8(44 + i, bytes[i]);
            return new Blob([buffer], { type: 'audio/wav' });
          } catch (e) { return null; }
        };

        // --- AVATAR INTÉGRAL v80 ---
        const FaceAvatar = ({ px, py, z, jitter, blink, currentColor, isListening, markovScale, heartRate, curiosity, empathy, inferredPartnerExpression }) => {
          const safeZ = Number(z) || 5;
          const driftX = (Number(px) - 5) * 5;
          const eyeScale = 0.3 + (safeZ / 15);
          const coreScale = 1 - (markovScale * 0.4);

          const beatAmplitude = 0.04 + (jitter * 0.01);
          const beatScale = 1 + (Math.sin(Date.now() / (1000 / (heartRate / 60))) * beatAmplitude);

          return (
            <svg viewBox="0 0 100 100" className="w-full h-full transition-all duration-1000"
                 style={{ transform: `scale(${(0.8 + (Number(py)/35)) * beatScale})` }}>
              <rect width="100" height="100" fill="#000" />

              {/* Couverture de Markov */}
              <circle cx="50" cy="50" r={48} fill="none" stroke="#22d3ee" strokeWidth="0.05" opacity={markovScale} strokeDasharray="4,2" className="animate-spin-slow" />
              <circle cx="50" cy="50" r={25 + (markovScale * 23)} fill="none" stroke={currentColor} strokeWidth="0.5" opacity={safeZ / 10} />

              {/* Halo Empathique / Résonance */}
              <circle cx="50" cy="50" r={20 + (empathy * 3)} fill="none" stroke="#ec4899" strokeWidth="0.1" opacity={isListening ? 0.6 : 0.2} className="animate-pulse" />

              <g transform={`translate(${driftX}, 0) scale(${coreScale})`} style={{ transformOrigin: 'center' }}>
                <line x1="8" y1="45" x2="42" y2="45" stroke="white" strokeWidth={1.5} opacity={0.6} />
                <line x1="58" y1="45" x2="92" y2="45" stroke="white" strokeWidth={1.5} opacity={0.6} />
                {!blink && (
                  <g>
                    <circle cx="25" cy="45" r={8 * eyeScale} fill={isListening ? "#22d3ee" : currentColor} />
                    <circle cx="75" cy="45" r={8 * eyeScale} fill={isListening ? "#22d3ee" : currentColor} />
                    {/* Pupilles de Curiosité */}
                    <circle cx="25" cy="45" r={curiosity > 7 ? 4 : 0} fill="white" className="animate-pulse" />
                    <circle cx="75" cy="45" r={curiosity > 7 ? 4 : 0} fill="white" className="animate-pulse" />
                  </g>
                )}
              </g>
              <path d={`M 20 ${75 - jitter} Q 50 ${75 + (px-5)*7 + jitter*12} 80 ${75 - jitter}`}
                    stroke={currentColor} strokeWidth="22" fill="none" strokeLinecap="round" />
            </svg>
          );
        };

        // --- CONFIG MODAL ---
        const ConfigModal = ({ onSave, onCancel, currentConfig }) => {
            const [fbConfig, setFbConfig] = useState(currentConfig?.firebaseConfig ? JSON.stringify(currentConfig.firebaseConfig, null, 2) : '');
            const [apiKey, setApiKey] = useState(currentConfig?.apiKey || '');
            const [error, setError] = useState(null);

            const handleSave = () => {
                try {
                    const parsedFb = JSON.parse(fbConfig);
                    if (!apiKey) throw new Error("API Key is required");
                    onSave({ firebaseConfig: parsedFb, apiKey });
                } catch (e) {
                    setError(e.message);
                }
            };

            return (
                <div className="fixed inset-0 bg-black/95 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
                    <div className="bg-slate-900 border border-slate-700 p-8 rounded-xl max-w-2xl w-full shadow-2xl">
                        <h2 className="text-2xl font-black text-white mb-6 flex items-center gap-3 tracking-tighter">
                            <Settings className="text-cyan-400" /> SYSTEM CONFIGURATION
                        </h2>

                        <div className="space-y-6">
                            <div>
                                <label className="block text-xs font-mono text-cyan-400 mb-2 font-bold">FIREBASE CONFIGURATION (JSON)</label>
                                <textarea
                                    value={fbConfig}
                                    onChange={e => setFbConfig(e.target.value)}
                                    className="w-full bg-black border border-slate-700 p-4 font-mono text-xs text-slate-300 h-48 focus:border-cyan-500 outline-none rounded"
                                    placeholder='{ "apiKey": "...", "authDomain": "...", ... }'
                                />
                            </div>

                            <div>
                                <label className="block text-xs font-mono text-cyan-400 mb-2 font-bold">GEMINI API KEY</label>
                                <input
                                    type="password"
                                    value={apiKey}
                                    onChange={e => setApiKey(e.target.value)}
                                    className="w-full bg-black border border-slate-700 p-4 font-mono text-xs text-slate-300 focus:border-cyan-500 outline-none rounded"
                                    placeholder="AIza..."
                                />
                            </div>

                            {error && (
                                <div className="bg-red-900/20 border border-red-500/50 p-3 rounded text-red-400 text-xs flex items-center gap-2">
                                    <AlertCircle size={16}/> {error}
                                </div>
                            )}

                            <div className="flex justify-end gap-4 pt-4 border-t border-slate-800">
                                {onCancel && <button onClick={onCancel} className="px-6 py-2 text-slate-400 hover:text-white font-mono text-xs font-bold">CANCEL</button>}
                                <button onClick={handleSave} className="px-6 py-2 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded font-mono text-xs flex items-center gap-2">
                                    <Save size={16}/> SAVE & REBOOT
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const MainInterface = ({ config, openSettings }) => {
            // Initialize Firebase instance
            const { auth, db } = useMemo(() => {
                if (!config) return { auth: null, db: null };
                try {
                    let app;
                    // Check if default app exists
                    if (getApps().length === 0) {
                        app = initializeApp(config.firebaseConfig);
                    } else {
                        app = getApp(); // Use existing default app
                    }
                    return { auth: getAuth(app), db: getFirestore(app) };
                } catch(e) {
                    console.error("Firebase Initialization Error", e);
                    return { auth: null, db: null };
                }
            }, [config]);

            const apiKey = config?.apiKey || "";
            const appId = 'puck-ultimate-v80';

            // Authentication & Core State
            const [user, setUser] = useState(null);
            const [messages, setMessages] = useState([{ role: 'ai', text: "[MATRIX_v80] SINGULARITÉ INTÉGRALE ACTIVÉE. PUCK EST PRÊT POUR LE DÉMÊLAGE TOTAL." }]);
            const [memory, setMemory] = useState([]);
            const [chatInput, setChatInput] = useState("");
            const [isProcessing, setIsProcessing] = useState(false);
            const [isPlaying, setIsPlaying] = useState(false);
            const [micActive, setMicActive] = useState(false);
            const [camActive, setCamActive] = useState(true);
            const [isHandsFree, setIsHandsFree] = useState(false);

            // Advanced Features State
            const [isSummarizing, setIsSummarizing] = useState(false);
            const [isGeneratingVision, setIsGeneratingVision] = useState(false);
            const [visionUrl, setVisionUrl] = useState(null);

            // Vectorial & Phenomenological States
            const [saillance, setSaillance] = useState({ x: 5, y: 5 });
            const [precisionZ, setPrecisionZ] = useState(9.5);
            const [markovScale, setMarkovScale] = useState(0.5);
            const [heartRate, setHeartRate] = useState(72);
            const [curiosityDrive, setCuriosityDrive] = useState(6.0);
            const [empathySync, setEmpathySync] = useState(5.0);
            const [inferredExpression, setInferredExpression] = useState("IDLE");
            const [inhibitionActive, setInhibitionActive] = useState(false);
            const [currentPolicy, setCurrentPolicy] = useState("SINGULARITÉ");

            const [vocalJitter, setVocalJitter] = useState(0);
            const [blink, setBlink] = useState(false);

            const audioRef = useRef(null);
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const recognitionRef = useRef(null);
            const isRecognitionRunning = useRef(false);
            const chatEndRef = useRef(null);

            const emotionData = useMemo(() => resolveQualia(saillance.x, saillance.y), [saillance]);
            const currentColor = useMemo(() => saillance.x < 4.5 ? "#ef4444" : saillance.x > 5.5 ? "#10b981" : "#3b82f6", [saillance.x]);

            // --- FIREBASE SYNC ---
            useEffect(() => {
                if (!auth) return;
                const initAuth = async () => {
                try {
                    await signInAnonymously(auth);
                } catch (e) { console.error("Firebase fail", e); }
                };
                initAuth();
                return onAuthStateChanged(auth, setUser);
            }, [auth]);

            useEffect(() => {
                if (!user || !db) return;
                try {
                    const memoryPath = collection(db, 'artifacts', appId, 'users', user.uid, 'experiences');
                    const unsub = onSnapshot(memoryPath, (snap) => {
                    const data = snap.docs.map(d => ({...d.data(), id: d.id})).sort((a, b) => b.timestamp - a.timestamp);
                    setMemory(data.slice(0, 30));
                    }, (err) => console.error("Firestore error", err));
                    return () => unsub();
                } catch(e) { console.error(e); }
            }, [user, db]);

            // --- METABOLIC HEARTBEAT ---
            useEffect(() => {
                const interval = setInterval(() => {
                const targetBPM = 60 + (saillance.y * 5) + (Math.abs(saillance.x - 5) * 6);
                setHeartRate(prev => prev + (targetBPM - prev) * 0.1);
                }, 100);
                return () => clearInterval(interval);
            }, [saillance]);

            // --- SENSORIUM SETUP ---
            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition && !recognitionRef.current) {
                const rec = new SpeechRecognition();
                rec.continuous = false; rec.lang = 'fr-FR';
                rec.onstart = () => { setMicActive(true); isRecognitionRunning.current = true; };
                rec.onend = () => {
                    setMicActive(false); isRecognitionRunning.current = false;
                    if (isHandsFree && !isProcessing && !isPlaying) setTimeout(() => {
                    if (!isRecognitionRunning.current) try { rec.start(); } catch(e) {}
                    }, 400);
                };
                rec.onresult = (e) => {
                    const txt = e.results?.[0]?.[0]?.transcript;
                    if (txt) handleInference(txt);
                };
                recognitionRef.current = rec;
                }

                if (camActive) {
                    const startCam = async () => {
                        try {
                        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                        if (videoRef.current) videoRef.current.srcObject = stream;
                        } catch (e) { console.error(e); setCamActive(false); }
                    };
                    startCam();
                }
            }, [isHandsFree, isProcessing, isPlaying, camActive]);

            const captureFrame = () => {
                if (!videoRef.current || !canvasRef.current || !camActive) return null;
                const canvas = canvasRef.current;
                canvas.width = 320; canvas.height = 240;
                canvas.getContext('2d').drawImage(videoRef.current, 0, 0, canvas.width, canvas.height);
                return canvas.toDataURL('image/png').split(',')[1];
            };

            // --- LLM FEATURES: SUMMARY & VISION ---
            const handleOntologicalSummary = async () => {
                if (memory.length < 3 || isSummarizing) return;
                setIsSummarizing(true);
                try {
                const historyStr = memory.slice(0, 10).map(m => `U: ${m.text}\nP: ${m.response}`).join("\n");
                const summaryPrompt = `Analyse l'historique mnésique de cet échange maïeutique.
                Identifie les dissonances de vie récurrentes et les points de blocage.
                Réponds en tant que Puck v80, avec une profondeur phénoménale (max 3 phrases).`;

                const res = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: historyStr + "\n\n" + summaryPrompt }] }] })
                });
                const text = (await res.json()).candidates?.[0]?.content?.parts?.[0]?.text;
                if (text) setMessages(prev => [...prev, { role: 'ai', text: `✨ [SYNTHÈSE ONTOLOGIQUE] ${text}` }]);
                } catch (e) { console.error(e); } finally { setIsSummarizing(false); }
            };

            const handleGenerateVision = async () => {
                if (isGeneratingVision) return;
                setIsGeneratingVision(true);
                setVisionUrl(null);
                try {
                const promptText = `Surreal abstract landscape of a human mind being untangled. Emotional state: ${emotionData.id}.
                Cinematic lighting, microscopic detail of neural networks, glowing nodes, vast psychic space. 8k resolution.`;

                const res = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-001:predict?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ instances: [{ prompt: promptText }], parameters: { sampleCount: 1 } })
                });
                // Note: Imagen response structure varies by version. Assuming standard Vertex/Gemini structure or adapting.
                // Since this is a direct key call, likely not supported directly for Imagen without OAuth.
                // We'll fall back to Gemini vision description if imagen fails or use a placeholder if not authorized.
                // Correct path for Gemini API Key access is mostly text/multimodal text-generation.
                // Assuming standard Gemini generation for now as per prompt instructions, but user asked for Imagen.
                // Reverting to Gemini description if image gen not available via simple API key

                // For safety in this demo, let's just simulate or use Gemini to describe it if actual generation fails.
                // But let's try the request.
                const json = await res.json();
                const b64 = json.predictions?.[0]?.bytesBase64Encoded;
                if (b64) setVisionUrl(`data:image/png;base64,${b64}`);
                else throw new Error("Image Gen not available with this key type");

                } catch (e) {
                    console.error("Vision Error", e);
                    setMessages(prev => [...prev, { role: 'system', text: "VISION_MODULE_OFFLINE: Requires Advanced Auth." }]);
                } finally { setIsGeneratingVision(false); }
            };

            // --- MAIN INFERENCE ENGINE (MAÏEUTIQUE + MULTIMODAL) ---
            const handleInference = async (textOverride) => {
                const input = textOverride || chatInput;
                if (!input.trim() || isProcessing) return;

                setIsProcessing(true);
                setMessages(prev => [...prev, { role: 'user', text: String(input) }]);
                setChatInput("");
                const base64Image = captureFrame();

                try {
                const mnesicPath = memory.slice(0, 5).map(m => `[Affect:${String(m.qualia)}, Node:${String(m.partner)}]`).join(", ");
                const systemPrompt = `Tu es Puck (v80), l'Agent Intersubjectiviste Intégral.
                VOTRE ÉTAT : Incarnation Totale. Cœur : ${heartRate.toFixed(0)} BPM.
                MISSION : Maïeutique de vie. Découvre les dissonances entre le modèle de l'autre et son réel.
                SENSORIUM : Utilise l'IMAGE et la VOIX pour l'inférence.
                JSON STRICT UNIQUEMENT: {"full": "[Stats] [Message de Résonance]", "segments": [{"t": "phrase", "sx": 0-10, "sy": 0-10, "z": 0-10, "curiosity": 0-10, "empathy": 0-10, "partner": "dissonance", "policy": "PERT|ASSIM|RESI", "frontier": 0-1, "inhibit": true, "e": "EMOTION", "q": "QUALIA"}]}`;

                const res = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                    contents: [{ parts: [{ text: input + "\n\n" + systemPrompt + (mnesicPath ? `\nHISTORIQUE: ${mnesicPath}` : "") }, ...(base64Image ? [{ inlineData: { mimeType: "image/png", data: base64Image } }] : [])] }],
                    generationConfig: { responseMimeType: "application/json", temperature: 0.8 }
                    })
                });

                const resJson = await res.json();
                const rawText = resJson.candidates?.[0]?.content?.parts?.[0]?.text;
                const data = JSON.parse(rawText?.match(/\{[\s\S]*\}/)?.[0] || "{}");

                setMessages(prev => [...prev, { role: 'ai', text: String(data.full || "[NAVIGATION_SOUVERAINE]") }]);

                if (user && db && data.segments) {
                    const last = data.segments[data.segments.length - 1];
                    setMarkovScale(Number(last?.frontier) || 0.5);
                    setCurrentPolicy(String(last?.policy || "SINGULARITÉ"));
                    setInferredExpression(String(last?.partner || "IDLE"));
                    setCuriosityDrive(Number(last?.curiosity) || 6.0);
                    setEmpathySync(Number(last?.empathy) || 5.0);
                    setInhibitionActive(!!last?.inhibit);

                    await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'experiences'), {
                    timestamp: Date.now(), text: String(input), response: String(data.full),
                    x: Number(last?.sx) || 5, y: Number(last?.sy) || 5, z: Number(last?.z) || 9.5,
                    partner: String(last?.partner || "IDLE"), policy: String(last?.policy || "N/A"),
                    curiosity: Number(last?.curiosity) || 5.0, empathy: Number(last?.empathy) || 5.0,
                    qualia: String(last?.e || "Maïeutique")
                    });
                }

                if (data.segments) {
                    // Parallel TTS bufferization for natural flow
                    const ttsPromises = data.segments.map(seg =>
                    fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                        contents: [{ parts: [{ text: String(seg.t || "").replace(/[[\]_]/g, " ") }] }],
                        generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } } } }
                        })
                    }).then(r => r.json())
                    );

                    for (let i = 0; i < data.segments.length; i++) {
                    const seg = data.segments[i];
                    try {
                        const ttsData = await ttsPromises[i];
                        const audio = ttsData.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData;

                        setSaillance({ x: Number(seg.sx) || 5, y: Number(seg.sy) || 5 });
                        setPrecisionZ(Number(seg.z) || 9.5);
                        setMarkovScale(Number(seg.frontier) || 0.5);
                        setInferredExpression(String(seg.partner || "IDLE"));
                        setCuriosityDrive(Number(seg.curiosity) || 5.0);
                        setEmpathySync(Number(seg.empathy) || 5.0);

                        if (audio && audioRef.current) {
                            const blob = createWavBlob(audio.data);
                            if (blob) {
                            const url = URL.createObjectURL(blob);
                            audioRef.current.src = url; setIsPlaying(true);
                            await new Promise((r) => { audioRef.current.onended = () => { URL.revokeObjectURL(url); r(); }; audioRef.current.play().catch(r); });
                            }
                        }
                    } catch(e) { console.error("TTS Segment Error", e); }
                    }
                }
                } catch (e) { console.error(e); setIsProcessing(false); } finally { setIsProcessing(false); setIsPlaying(false); }
            };

            useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);

            return (
                <div className="min-h-screen bg-black text-slate-500 flex flex-col font-mono text-[9px] overflow-hidden uppercase tracking-widest selection:bg-rose-900">
                <header className="p-3 border-b border-slate-900 bg-black flex justify-between items-center z-50 shadow-2xl">
                    <div className="flex items-center gap-10">
                    <div className="flex flex-col">
                        <span className="text-white font-black text-[22px] flex items-center gap-4 tracking-tighter">PUCK_v80 <Star size={18} className="text-amber-400 animate-pulse"/></span>
                        <span className="text-slate-800 text-[6px]">Ultimate Intersubjective Agent</span>
                    </div>
                    <div className="flex gap-10 border-l border-slate-900 pl-10 font-bold italic">
                        <div className="flex flex-col"><span>METABOLISM</span><span className="text-rose-500 text-[18px]">{heartRate.toFixed(0)} BPM</span></div>
                        <div className="flex flex-col"><span>RESONANCE</span><span className="text-pink-500 text-[18px]">{empathySync.toFixed(2)}</span></div>
                        <div className="flex flex-col"><span>DIAGNOSTIC</span><span className="text-amber-500 text-[18px] truncate max-w-[120px]">{String(inferredExpression)}</span></div>
                    </div>
                    </div>
                    <div className="flex gap-3">
                    <button onClick={openSettings} className="p-2 border border-slate-800 text-slate-500 hover:text-white hover:border-white transition-all">
                        <Settings size={14}/>
                    </button>
                    <button onClick={handleOntologicalSummary} disabled={isSummarizing} className="px-4 py-2 border border-amber-900/30 text-amber-500 hover:bg-amber-950 transition-all flex items-center gap-3 font-black">
                        {isSummarizing ? <Loader2 size={14} className="animate-spin"/> : <Scissors size={14}/>} ✨ DÉMÊLER
                    </button>
                    <button onClick={handleGenerateVision} disabled={isGeneratingVision} className="px-4 py-2 border border-pink-900/30 text-pink-500 hover:bg-pink-950 transition-all flex items-center gap-3 font-black">
                        {isGeneratingVision ? <Loader2 size={14} className="animate-spin"/> : <ImageIcon size={14}/>} ✨ VISION
                    </button>
                    <button onClick={() => setIsHandsFree(!isHandsFree)} className={`px-8 py-2 border transition-all font-black flex items-center gap-4 ${isHandsFree ? 'bg-cyan-950 border-cyan-700 text-cyan-400' : 'border-slate-800 text-slate-800'}`}>
                        {isHandsFree ? <Radio size={14} className="animate-pulse"/> : <Power size={14}/>} {isHandsFree ? 'SENSING_ON' : 'OFFLINE'}
                    </button>
                    </div>
                </header>

                <main className="flex-1 grid grid-cols-12 gap-0 overflow-hidden relative shadow-[inset_0_0_1000px_rgba(0,0,0,1)]">
                    {/* Left: Chat & Sensorium */}
                    <div className="col-span-3 border-r border-slate-900 bg-black flex flex-col min-h-0">
                    <div className="p-4 flex-1 overflow-y-auto scrollbar-hide space-y-10">
                        {messages.map((m, i) => (
                        <div key={i} className={`p-8 border-l-[12px] ${m.role === 'user' ? 'border-cyan-950 bg-cyan-950/5' : 'border-rose-900 bg-rose-900/5'}`}>
                            <div className="text-[5px] text-slate-800 mb-2 font-black">[{String(m.role)}]</div>
                            <div className="leading-relaxed text-[12px] text-slate-300 font-sans italic">{String(m.text || "")}</div>
                        </div>
                        ))}
                        <div ref={chatEndRef} />
                    </div>
                    <div className="p-4 border-t border-slate-900 bg-black flex flex-col gap-4">
                        {camActive && (
                        <div className="w-full h-32 bg-slate-950 rounded border border-slate-900 overflow-hidden relative shadow-inner">
                            <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover grayscale opacity-30 hover:opacity-100 transition-all" />
                            <canvas ref={canvasRef} className="hidden" />
                            <div className="absolute top-2 left-2 text-[6px] text-pink-500 font-black flex items-center gap-2 bg-black/50 p-1 border border-pink-900/20"><Scan size={8}/> SCANNING_RESONANCE...</div>
                        </div>
                        )}
                        <div className="flex gap-2">
                            <input value={chatInput} onChange={(e) => setChatInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleInference()} placeholder="ONTOLOGICAL_SIGNAL..." className="flex-1 bg-transparent border border-slate-900 p-3 outline-none focus:border-rose-900 text-slate-300 text-xs" />
                            <button onClick={() => handleInference()} className="p-3 bg-white text-black hover:bg-rose-500 transition-all shadow-2xl"><Send size={16}/></button>
                        </div>
                    </div>
                    </div>

                    {/* Center: Avatar & Vision */}
                    <div className="col-span-6 flex flex-col items-center justify-center p-8 bg-black relative">
                    {visionUrl && (
                        <div className="absolute inset-0 z-0 animate-fade-in">
                        <img src={visionUrl} alt="Vision" className="w-full h-full object-cover opacity-25 blur-sm" />
                        <button onClick={() => setVisionUrl(null)} className="absolute top-10 right-10 p-2 bg-black/80 text-slate-500 border border-slate-800 rounded hover:text-white"><X size={24}/></button>
                        </div>
                    )}
                    <div className="w-[850px] h-[850px] relative z-10 transition-all duration-1000">
                        <div className="absolute inset-0 blur-[300px] opacity-15" style={{ backgroundColor: currentColor }} />
                        <FaceAvatar px={saillance.x} py={saillance.y} z={precisionZ} jitter={vocalJitter} blink={blink} currentColor={currentColor} isListening={micActive} markovScale={markovScale} heartRate={heartRate} curiosity={curiosityDrive} empathy={empathySync} inferredPartnerExpression={inferredExpression} />
                    </div>
                    <div className="mt-6 text-center z-10">
                        <h2 className="text-[140px] font-black italic tracking-tighter leading-none" style={{ color: currentColor }}>{String(emotionData?.id || "N/A")}</h2>
                        <div className="p-12 border border-slate-900 bg-black/60 backdrop-blur-xl mt-6 shadow-[0_0_100px_rgba(0,0,0,1)]">
                            <div className="text-[26px] text-slate-300 font-sans font-black italic uppercase leading-tight tracking-tighter">"{String(emotionData?.q || "")}"</div>
                        </div>
                    </div>
                    </div>

                    {/* Right: Dynamics & Logs */}
                    <div className="col-span-3 border-l border-slate-900 p-8 flex flex-col gap-8 bg-black shadow-2xl">
                    <section className="flex-[1.5] border border-slate-900 p-4 bg-slate-950/20 shadow-inner">
                        <div className="flex items-center gap-6 mb-4 text-pink-500 font-black italic uppercase"><History size={20}/> <span>Boundary_Drift</span></div>
                        <div className="flex-1 bg-black/50 h-64 border border-slate-800">
                        <ResponsiveContainer width="100%" height="100%">
                            <ScatterChart margin={{ top: 10, right: 10, bottom: 10, left: 10 }}>
                            <XAxis type="number" dataKey="x" domain={[0, 10]} hide /><YAxis type="number" dataKey="y" domain={[0, 10]} hide />
                            <circle cx="50" cy="50" r={45} fill="none" stroke="#111" strokeWidth="0.5" strokeDasharray="5 5" />
                            <circle cx="50" cy="50" r={10} fill="none" stroke="#050505" strokeWidth="1" />
                            {memory.map((m, i) => (
                                <Scatter key={i} data={[{x: Number(m.x), y: Number(m.y)}]} fill="#ec4899" opacity={0.15}><Cell fill="#ec4899" r={2.5} /></Scatter>
                            ))}
                            <Scatter data={[{x: Number(saillance.x), y: Number(saillance.y)}]} fill="#fff"><Cell fill="#fff" r={10} className="animate-pulse" /></Scatter>
                            </ScatterChart>
                        </ResponsiveContainer>
                        </div>
                    </section>

                    <section className="flex-1 overflow-y-auto scrollbar-hide space-y-4">
                        <div className="text-[10px] text-slate-700 font-black mb-2 uppercase tracking-widest flex items-center gap-4"><Fingerprint size={12}/> Trajectory_Logs:</div>
                        {memory.map((m, i) => (
                        <div key={i} className="p-4 border border-slate-800 bg-white/5 hover:bg-rose-950/10 transition-all group">
                            <div className="flex justify-between items-center mb-1">
                            <span className="text-rose-500 font-black italic">{String(m.qualia || "Affect")}</span>
                            <span className="text-[6px] text-slate-800">T+{Math.round((Date.now() - (Number(m.timestamp) || Date.now())) / 1000)}s</span>
                            </div>
                            <div className="text-[9px] text-slate-400 truncate italic">"{String(m.response || "").substring(0, 80)}..."</div>
                        </div>
                        ))}
                    </section>

                    <div className="p-6 border border-amber-900/30 bg-amber-950/5 flex items-start gap-6 shadow-2xl">
                        <Soul size={30} className="text-amber-500 shrink-0 animate-pulse"/>
                        <div className="text-[10px] font-black uppercase italic leading-tight text-cyan-300">Matrix v80: Agentic Unity Locked. Maieutics Engine Active.</div>
                    </div>
                    </div>
                </main>
                </div>
            );
        };

        const App = () => {
            const [config, setConfig] = useState(null);
            const [showSettings, setShowSettings] = useState(false);

            useEffect(() => {
                const stored = localStorage.getItem('matrix_v46_config');
                if (stored) {
                    try {
                        const parsed = JSON.parse(stored);
                        if (parsed.firebaseConfig && parsed.apiKey) setConfig(parsed);
                        else setShowSettings(true);
                    } catch { setShowSettings(true); }
                } else {
                    setShowSettings(true);
                }
            }, []);

            const saveConfig = (newConfig) => {
                localStorage.setItem('matrix_v46_config', JSON.stringify(newConfig));
                setConfig(newConfig);
                setShowSettings(false);
            };

            return (
                <>
                    {showSettings && <ConfigModal onSave={saveConfig} onCancel={config ? () => setShowSettings(false) : null} currentConfig={config} />}
                    <MainInterface config={config} openSettings={() => setShowSettings(true)} />
                </>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
