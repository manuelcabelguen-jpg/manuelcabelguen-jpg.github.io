    <!-- 1. Tailwind CSS -->

    <script>

            theme: {
                extend: {
                    fontFamily: {

                        'pulse-fast': 'pulse 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'spin-slow': 'spin 50s linear infinite',
                        'breathe': 'breathe 10s ease-in-out infinite',
                    },
                    keyframes: {
                        breathe: {
                            '0%, 100%': { transform: 'scale(0.94)' },

        .no-scrollbar::-webkit-scrollbar { display: none; }

        .rich-editor p { margin-bottom: 0.5em; }
        .rich-editor b, .rich-editor strong { color: #f0f9ff; }

        /* Modal Overlay */
        .modal-overlay { background-color: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px); }
    </style>
</head>

        const SectionType = { FIXED: 'fixed', DYNAMIC: 'dynamic' };
        const SourceType = { TEXT: 'Text', PDF: 'PDF' };

        // --- DATA DEFAULTS ---
        const DEFAULT_REPORT_STRUCTURES = [
            {
                id: 'rep_mpci',
                label: 'Rapport de programme MPCI – Délinquance sexuelle',
                sections: [
                    { title: "1. Assiduité et participation", content: "<h3>INTRODUCTION :</h3><p>Rédiger ici...</p><h3>ASSIDUITÉ ET PARTICIPATION :</h3><p>Rédiger ici...</p>", genPrompt: "Pour {{nom}} (FPS: {{fps}}), analyse l'assiduité et la participation active au programme. Note les absences, les retards et l'engagement global.", verifPrompt: "Vérifie si le texte mentionne le taux de présence, les retards éventuels et qualifie le niveau de participation active." },
                    { title: "2. Progrès - Vie personnelle", content: "<h3>FACTEUR DE RISQUE DYNAMIQUE : Vie personnelle et affective</h3><p>Analyse...</p>", genPrompt: "Analyse le facteur de risque dynamique 'Vie personnelle et affective' pour {{nom}}. Identifie les stabilités et instabilités récentes.", verifPrompt: "Vérifie la présence d'une analyse des relations affectives et de la stabilité résidentielle/personnelle." },
                    { title: "2. Progrès - Toxicomanie", content: "<h3>FACTEUR DE RISQUE DYNAMIQUE : Toxicomanie</h3><p>Analyse...</p>", genPrompt: "Évalue le facteur 'Toxicomanie' pour {{nom}}. Note les progrès, les rechutes éventuelles ou le maintien de la sobriété.", verifPrompt: "Vérifie si l'abstinence ou la consommation est clairement établie et si les risques de rechute sont évalués." },
                    { title: "2. Progrès - Relations fam.", content: "<h3>FACTEUR DE RISQUE DYNAMIQUE : Relations matrimoniales et familiales</h3><p>Analyse...</p>", genPrompt: "Analyse les 'Relations matrimoniales et familiales' de {{nom}}. Le soutien familial est-il un facteur de protection ou de risque ?", verifPrompt: "Vérifie si la nature des relations familiales (soutien vs conflit) est décrite." },
                    { title: "2. Progrès - Fréquentations", content: "<h3>FACTEUR DE RISQUE DYNAMIQUE : Fréquentations</h3><p>Analyse...</p>", genPrompt: "Examine les fréquentations de {{nom}}. Y a-t-il des associations avec des pairs délinquants ou pro-sociaux ?", verifPrompt: "Vérifie la mention des fréquentations positives ou négatives." },
                    { title: "2. Progrès - Emploi/Études", content: "<h3>FACTEUR DE RISQUE DYNAMIQUE : Emploi et études</h3><p>Analyse...</p>", genPrompt: "Fais le point sur la situation 'Emploi et études' de {{nom}}. Stabilité, recherche d'emploi ou formation en cours.", verifPrompt: "Vérifie si le statut d'emploi ou d'étude est actuel." },
                    { title: "2. Progrès - Attitudes", content: "<h3>FACTEUR DE RISQUE DYNAMIQUE : Attitudes</h3><p>Analyse...</p>", genPrompt: "Analyse les attitudes de {{nom}} envers la criminalité, l'autorité et le changement. Note les distorsions cognitives observées.", verifPrompt: "Vérifie si les attitudes pro-criminelles ou pro-sociales sont analysées." },
                    { title: "2. Progrès - Comportement", content: "<h3>FACTEUR DE RISQUE DYNAMIQUE : Comportement dans la collectivité</h3><p>Analyse...</p>", genPrompt: "Décris le comportement de {{nom}} dans la collectivité. Respect des règles, interactions sociales.", verifPrompt: "Vérifie si le respect des conditions et le comportement social sont abordés." },
                    { title: "2. Progrès - Maîtrise de soi", content: "<h3>ÉVALUATION DE L’AGENT(E) DE PROGRAMMES DES PLANS DE MAÎTRISE DE SOI</h3><p>Analyse...</p>", genPrompt: "Évalue les plans de maîtrise de soi de {{nom}}. Utilise-t-il les stratégies apprises pour gérer ses émotions et impulsions ?", verifPrompt: "Vérifie si l'application des stratégies de maîtrise de soi est évaluée." },

                ]
            },
            {
                id: 'rep_prep',
                label: 'Rapport Préparatoire (Exemple)',
                sections: [
                    { title: "1. Introduction", content: "<p>Introduction du rapport préparatoire...</p>", genPrompt: "Rédige une introduction formelle pour le dossier de {{nom}}.", verifPrompt: "Vérifie la présence du contexte légal et des dates clés." },
                    { title: "2. Analyse des facteurs", content: "<p>Analyse...</p>", genPrompt: "Effectue une analyse détaillée des éléments fournis pour {{nom}}.", verifPrompt: "Vérifie que tous les facteurs de risque pertinents sont couverts." },
                    { title: "3. Conclusion", content: "<p>Conclusion...</p>", genPrompt: "Synthétise les observations pour {{nom}} et formule une conclusion claire.", verifPrompt: "Vérifie la présence d'une recommandation finale claire." }
                ]
            },
            {
                id: 'rep_maintien',
                label: 'Rapport de Maintien des Acquis (Exemple)',
                sections: [
                    { title: "1. Bilan de la période", content: "<p>Bilan des acquis...</p>", genPrompt: "Fais le bilan des compétences acquises et des progrès réalisés par {{nom}}.", verifPrompt: "Vérifie si les progrès concrets sont listés." },
                    { title: "2. Objectifs futurs", content: "<p>Nouveaux objectifs...</p>", genPrompt: "Propose des objectifs concrets et mesurables pour la prochaine période.", verifPrompt: "Vérifie si les objectifs sont SMART." }
                ]
            }
        ];

        // --- FACE AVATAR (Dr Puck) ---
        const FaceAvatar = ({ sx, sy, z, color, isThinking, isSpeaking, breathing, isListening, energy }) => {
            const beat = 1 + (Math.sin(Date.now() / 200) * 0.025);
            const opacityLevel = 0.3 + (energy / 150);

            return (
                <div className={`relative w-40 h-40 mx-auto transition-all duration-1000 ${breathing ? 'animate-breathe' : ''}`}
                     style={{ transform: `scale(${beat})` }}>
                    <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-[0_0_20px_rgba(34,211,238,0.2)]">
                        {/* Halo de Markov */}
                        <circle cx="50" cy="50" r={48} fill="none" stroke={isListening ? "#22d3ee" : color} strokeWidth="0.5" strokeDasharray="3 3" className="animate-spin-slow opacity-30" />

                        {/* Noyau Allostatique */}
                        <circle cx="50" cy="50" r={25 + (z * 1.5)} fill="none" stroke={color} strokeWidth="1" opacity={opacityLevel} />

                        {/* Yeux Vectoriels (Inférence Hiérarchique) */}
                        <g transform={`translate(${(sx-5)*1.5}, 0)`}>
                            <circle cx="35" cy="45" r={4 + (z/4)} fill={isListening ? "#22d3ee" : (isThinking ? "#a855f7" : color)} />
                            <circle cx="65" cy="45" r={4 + (z/4)} fill={isListening ? "#22d3ee" : (isThinking ? "#a855f7" : color)} />
                            {/* Point de focus Système 2 */}
                            {!isThinking && <circle cx="35" cy="45" r="1" fill="white" opacity="0.5" />}
                            {!isThinking && <circle cx="65" cy="45" r="1" fill="white" opacity="0.5" />}
                        </g>

                        {/* Bouche (Actuation Motrice / Prosodie) */}
                        <path
                            d={`M 35 75 Q 50 ${75 + (isSpeaking ? 16 : (sx-5)*3)} 65 75`}
                            stroke={color}
                            strokeWidth="3"
                            fill="none"
                            strokeLinecap="round"
                            className="transition-all duration-300"
                        />
                    </svg>
                </div>
            );
        };

        // --- COMPOSANTS UTILITAIRES ---
        const RichEditor = ({ value, onChange }) => {
            const editorRef = useRef(null);
            useEffect(() => { if (editorRef.current && editorRef.current.innerHTML !== value) editorRef.current.innerHTML = value; }, []);
            return (
                <div className="flex flex-col h-full border border-slate-700 rounded-lg overflow-hidden glass">
                    <div className="flex items-center gap-1 p-2 bg-slate-900/50 border-b border-slate-700">
                        <button onClick={() => {document.execCommand('bold', false); editorRef.current.focus()}} className="p-1 text-slate-400 hover:text-white hover:bg-slate-700 rounded"><Icons.Bold className="w-4 h-4"/></button>
                        <button onClick={() => {document.execCommand('italic', false); editorRef.current.focus()}} className="p-1 text-slate-400 hover:text-white hover:bg-slate-700 rounded"><Icons.Italic className="w-4 h-4"/></button>
                        <button onClick={() => {document.execCommand('insertUnorderedList', false); editorRef.current.focus()}} className="p-1 text-slate-400 hover:text-white hover:bg-slate-700 rounded"><Icons.List className="w-4 h-4"/></button>
                    </div>
                    <div ref={editorRef} className="rich-editor flex-1 p-4 overflow-y-auto" contentEditable onInput={(e) => onChange(e.target.innerHTML)} dangerouslySetInnerHTML={{ __html: value }} />
                </div>
            );
        };

        // --- MOTEUR IA AVEC VARIABLES (Gemini Integration) ---
        const generateSectionContent = async (promptText, sources, context, apiKey, existingContent = "") => {
            if (!apiKey) return "<p style='color:red'>[ERREUR] Clé API Gemini manquante. Veuillez la configurer dans l'Admin.</p>";

            // 1. Remplacement des variables
            let finalPrompt = promptText
                .replace(/{{nom}}/g, context.nom || "[NOM]")
                .replace(/{{fps}}/g, context.fps || "[FPS]")
                .replace(/{{date_naissance}}/g, context.dateNaissance || "[DATE]");

            const formatCitation = (s) => `(${s.docType || 'Doc'} de ${s.author || 'Inconnu'} datée du ${s.date || 'N/D'})`;

            const contextText = `
                Contexte Dossier:
                Nom: ${context.nom}
                FPS: ${context.fps}

                Sources Disponibles:
                ${sources.map(s => `- ${s.title}: ${s.content.substring(0, 500)}...`).join('\n')}
            `;

            const systemInstruction = "Tu es un assistant de rédaction pour les services correctionnels. Tu dois être précis, factuel et utiliser les sources fournies. Analyse les risques et les progrès.";

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Contexte:\n${contextText}\n\nTâche:\n${finalPrompt}` }] }],
                        systemInstruction: { parts: [{ text: systemInstruction }] },
                        generationConfig: { responseMimeType: "text/plain", temperature: 0.7 }
                    })
                });
                const result = await res.json();
                let aiText = "Erreur de génération.";
                if (result.candidates && result.candidates[0] && result.candidates[0].content && result.candidates[0].content.parts && result.candidates[0].content.parts[0]) {
                    aiText = result.candidates[0].content.parts[0].text;
                }

                // Formattage basique HTML
                aiText = aiText.replace(/\n/g, "<br/>").replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");

                return aiText;
            } catch (e) {

                            setSections(prev => prev.map(s => s.id === activeSectionId ? { ...s, content: newContent } : s));

            const toggleMic = () => {

            // Handlers

                if (activeSection.structureId && activeSection.sectionIndex !== undefined) {
                    const struct = reportStructures.find(s => s.id === activeSection.structureId);

                                                        <div className="flex flex-col">
                                                            <span className="text-xs font-black text-cyan-400 uppercase tracking-[0.2em]">Dr. Puck v114</span>
                                                            <span className="text-[10px] text-slate-500 font-mono">Inférence Active</span>
                                                        </div>
                                                        <div className="flex gap-3">
                                                            {isAdminMode && (
                                                                <button onClick={handleOpenAdmin} title="Configurer les prompts" className="p-2 text-slate-500 hover:text-cyan-400 border border-slate-700 rounded-full hover:bg-slate-800 transition-colors">
                                                                    <Icons.Settings className="w-4 h-4"/>
                                                                </button>
                                                            )}
                                                            <button onClick={toggleMic} className={`p-2 rounded-full border transition-all ${isListening ? 'bg-rose-900/50 border-rose-500 text-rose-400 animate-pulse' : 'border-slate-700 text-slate-400 hover:text-white'}`} title="Dictée vocale">
                                                                {isListening ? <Icons.Mic className="w-4 h-4"/> : <Icons.MicOff className="w-4 h-4"/>}
                                                            </button>
                                                        </div>
                                                    </div>

                                                    <div className="flex gap-3">
                                                        <button onClick={() => handleCopilotGenerate('verify')} disabled={isGenerating} className="flex-1 py-3 bg-emerald-900/20 border border-emerald-900/50 hover:bg-emerald-900/40 text-emerald-400 rounded-xl text-xs font-bold uppercase tracking-wider flex justify-center items-center gap-2 transition-all">
                                                            <Icons.CheckCircle className="w-4 h-4"/> Vérifier Contenu
                                                        </button>
                                                        <button onClick={() => handleCopilotGenerate('replace')} disabled={isGenerating} className="flex-1 py-3 bg-purple-900/20 border border-purple-900/50 hover:bg-purple-900/40 text-purple-400 rounded-xl text-xs font-bold uppercase tracking-wider flex justify-center items-center gap-2 transition-all">
                                                            <Icons.Bot className="w-4 h-4"/> Générer Rédaction
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        <RichEditor value={activeSection.content} onChange={(val) => setSections(sections.map(s => s.id === activeSectionId ? { ...s, content: val, status: 'draft' } : s))} />

                                        {activeSection.type === SectionType.DYNAMIC && (
                                            <div className="flex flex-wrap gap-2 pt-2">
                                                <span className="text-[10px] font-mono text-slate-500 uppercase tracking-wider self-center mr-2">Sources Actives:</span>
                                                {sources.map(src => {
                                                    const isSel = activeSection.selectedSourceIds && activeSection.selectedSourceIds.includes(src.id);
                                                    return (
                                                        <button key={src.id} onClick={() => setSections(sections.map(s=>s.id===activeSectionId?{...s, selectedSourceIds:isSel?s.selectedSourceIds.filter(i=>i!==src.id):[...(s.selectedSourceIds||[]), src.id]}:s))}
                                                            className={`px-3 py-1 rounded-full text-[10px] border flex items-center gap-2 transition-all ${isSel ? 'bg-cyan-900/40 border-cyan-500/50 text-cyan-300' : 'bg-slate-900 border-slate-700 text-slate-500 hover:text-slate-300'}`}>
                                                            {src.type === SourceType.PDF ? <Icons.FilePdf className="w-3 h-3"/> : <Icons.FileText className="w-3 h-3"/>} {src.title}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </React.Fragment>
                                )}
                            </div>

                            {/* PREVIEW PANEL */}
                            {previewSourceId ? (
                                <div className="w-1/2 border-l border-slate-800 bg-slate-900/80 flex flex-col animate-in slide-in-from-right duration-300 backdrop-blur-sm">
                                    <div className="h-12 border-b border-slate-800 flex justify-between items-center px-4"><span className="font-bold text-xs uppercase text-slate-400 tracking-widest font-mono">Aperçu Source</span><button onClick={() => setPreviewSourceId(null)}><Icons.X className="w-4 h-4 text-slate-500 hover:text-white"/></button></div>
                                    <div className="flex-1 p-4 overflow-hidden relative">
                                        {activeSourceData && activeSourceData.type === SourceType.PDF ? <iframe src={activeSourceData.content} className="w-full h-full bg-white border border-slate-700 rounded-lg opacity-90"></iframe> : <div className="w-full h-full bg-slate-950 border border-slate-800 rounded-lg p-6 overflow-y-auto font-mono text-sm text-slate-400">{activeSourceData ? activeSourceData.content : ''}</div>}
                                    </div>
                                </div>
                            ) : (
                                <div className="w-72 border-l border-slate-800 bg-slate-950/50 flex flex-col shrink-0" onDragOver={e=>{e.preventDefault(); setIsDragOver(true)}} onDragLeave={()=>setIsDragOver(false)} onDrop={e=>{e.preventDefault(); setIsDragOver(false); if(e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]);}}>
                                    <div className="p-4 border-b border-slate-800 flex justify-between items-center">
                                        <h3 className="font-bold text-xs text-slate-400 uppercase tracking-widest font-mono">Sources Données</h3>
                                        <button onClick={()=>fileInputRef.current.click()}><Icons.Upload className="w-4 h-4 text-cyan-600 hover:text-cyan-400"/></button>
                                        <input type="file" ref={fileInputRef} className="hidden" onChange={e=>e.target.files[0] && processFile(e.target.files[0])}/>
                                    </div>
                                    <div className={`flex-1 p-3 space-y-2 overflow-y-auto scrollbar-hide ${isDragOver?'bg-cyan-900/20':''}`}>
                                        {sources.map(s=>(<div key={s.id} onClick={()=>setPreviewSourceId(s.id)} className="bg-slate-900 p-3 border border-slate-800 rounded-lg cursor-pointer hover:border-cyan-700 hover:shadow-lg hover:shadow-cyan-900/20 transition-all text-xs truncate flex gap-3 text-slate-400 group"><Icons.FileText className="w-4 h-4 text-slate-600 group-hover:text-cyan-500"/> {s.title}</div>))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AssistantProV10 />);
    </script>
</body>
</html>
