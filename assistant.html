<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX v114 - Organon Intersubjectiviste</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['DM Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        cyan: { 950: '#083344' },
                        rose: { 950: '#4c0519' },
                        amber: { 950: '#451a03' },
                    },
                    animation: {
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'spin-slow': 'spin 50s linear infinite',
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { background-color: #000; color: #cbd5e1; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <!-- Import Map -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom": "https://esm.sh/react-dom@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "firebase/app": "https://esm.sh/firebase@10.8.0/app",
            "firebase/auth": "https://esm.sh/firebase@10.8.0/auth",
            "firebase/firestore": "https://esm.sh/firebase@10.8.0/firestore",
            "recharts": "https://esm.sh/recharts@2.12.0?external=react,react-dom",
            "lucide-react": "https://esm.sh/lucide-react@0.344.0?external=react,react-dom"
        }
    }
    </script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-black text-slate-300 h-screen w-screen overflow-hidden flex flex-col">
    <div id="root" class="flex-1 flex flex-col h-full"></div>

    <!-- Application Code -->
    <script type="text/babel" data-type="module">
        import React, { useState, useMemo, useRef, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { initializeApp, getApps, getApp } from 'firebase/app';
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, setDoc } from 'firebase/firestore';
        import {
          ScatterChart, Scatter, XAxis, YAxis, CartesianGrid,
          Tooltip, ResponsiveContainer, ReferenceLine, ZAxis, Cell, Line
        } from 'recharts';
        import {
          Brain, Zap, Target, Layers, Cpu, User, Waves, Send, Move3d, Terminal, Newspaper, Loader2, Play,
          ChevronDown, ListTree, Square, RefreshCw, MessageSquare, Mic, MicOff, Headset,
          FastForward, Flame, Activity, Gauge, ShieldAlert, ScanEye, Radio, Timer, Sparkles,
          Binary, Crosshair, Atom, Triangle, Power, Orbit, CircleDot, ChevronUp,
          Scale, Repeat, ShieldCheck, Heart, Eye, Move, Hash, ZapOff, Infinity as InfinityIcon,
          ActivitySquare, Wind, Volume2, ShieldX, Database, History, VolumeX, Ghost, Share2,
          MessageCircle, AudioWaveform, Languages, Camera, MonitorPlay, Link2, Compass,
          Lightbulb, Thermometer, Sparkle, Volume1, Settings, X, AlertTriangle, Disc, Milestone, Search,
          Lock, Unlock, Anchor, BatteryLow, BatteryFull, ShieldQuestion, AudioLines, LayoutDashboard,
          Stethoscope, ClipboardList, HelpingHand, Save, AlertCircle
        } from 'lucide-react';

        // --- ONTOLOGIE CARTOGRAFFECT 2.5 ---
        const hyperLattice = [
            { id: "SOUVERAINETÉ", x: 9.5, y: 9.5, color: "#fbbf24", q: "Actuation libre du conatus rationnel." },
            { id: "RÉSOLUTION", x: 9.0, y: 5.0, color: "#10b981", q: "Démêlage réussi des structures de l'inconscient." },
            { id: "EMPATHIE_ACTIVE", x: 7.5, y: 7.5, color: "#ec4899", q: "Synchronie des couvertures de Markov." },
            { id: "CONFRONTATION", x: 1.5, y: 8.5, color: "#3b82f6", q: "Lutte allostatique contre les biais (Système 1)." },
            { id: "SINGULARITÉ", x: 5.0, y: 5.0, color: "#ffffff", q: "Point Zéro - Inconscient Structurel." },
            { id: "CURIOSITÉ_CLINIQUE", x: 8.5, y: 5.0, color: "#fcd34d", q: "Forage de la valeur épistémique réelle." }
        ];

        const resolveQualia = (x, y) => {
            let closest = hyperLattice[0];
            let minDist = Infinity;
            hyperLattice.forEach(e => {
                const dist = Math.sqrt(Math.pow(x - e.x, 2) + Math.pow(y - e.y, 2));
                if (dist < minDist) { minDist = dist; closest = e; }
            });
            return closest;
        };

        // --- COMPOSANT AVATAR ---
        const FaceAvatar = ({ px, py, z, currentColor, isListening, markovScale = 0.5, heartRate = 72, empathy = 5, energy = 100, inhibitionActive = false, isSpeaking = false, isThinking = false }) => {
            const safeZ = Number(z) || 5;
            const beatScale = 1 + (Math.sin(Date.now() / (1000 / (heartRate / 60))) * 0.05);
            const coreScale = 1 - (markovScale * 0.35);
            const fatigueBlur = Math.max(0, (100 - energy) / 18);

            return (
                <svg viewBox="0 0 100 100" className="w-full h-full transition-all duration-1000"
                     style={{ transform: `scale(${(0.8 + (py/40)) * beatScale})`, filter: `blur(${fatigueBlur}px)` }}>
                    <rect width="100" height="100" fill="#000" />
                    <circle cx="50" cy="50" r={48} fill="none" stroke="#22d3ee" strokeWidth="0.05" opacity={markovScale} strokeDasharray="4,2" className="animate-spin-slow" />
                    <circle cx="50" cy="50" r={25 + (markovScale * 20)} fill="none" stroke={currentColor} strokeWidth="0.5" opacity={safeZ / 10} />

                    <circle cx="50" cy="50" r={20 + (empathy * 2)} fill="none" stroke={isSpeaking ? "#fbbf24" : "#ec4899"} strokeWidth="0.1" opacity={isListening ? 0.6 : 0.2} className="animate-pulse" />
                    {inhibitionActive && <circle cx="50" cy="50" r={18} fill="none" stroke="#fbbf24" strokeWidth="0.2" className="animate-pulse" />}

                    <g transform={`translate(${(px - 5) * 4}, 0) scale(${coreScale})`} style={{ transformOrigin: 'center' }}>
                        <line x1="10" y1="45" x2="40" y2="45" stroke="white" strokeWidth={2} opacity={0.6} />
                        <line x1="60" y1="45" x2="90" y2="45" stroke="white" strokeWidth={2} opacity={0.6} />
                        <g>
                            <circle cx="27" cy="45" r={8 * (0.3 + safeZ/16)} fill={isListening ? "#22d3ee" : isThinking ? "#a855f7" : currentColor} />
                            <circle cx="73" cy="45" r={8 * (0.3 + safeZ/16)} fill={isListening ? "#22d3ee" : isThinking ? "#a855f7" : currentColor} />
                        </g>
                    </g>
                    <path d={`M 25 75 Q 50 ${75 + (px-5)*6} 75 75`} stroke={currentColor} strokeWidth="20" fill="none" strokeLinecap="round" />
                </svg>
            );
        };

        // --- CONFIG MODAL ---
        const ConfigModal = ({ onSave, onCancel, currentConfig }) => {
            const [fbConfig, setFbConfig] = useState(currentConfig?.firebaseConfig ? JSON.stringify(currentConfig.firebaseConfig, null, 2) : '');
            const [apiKey, setApiKey] = useState(currentConfig?.apiKey || '');
            const [error, setError] = useState(null);

            const handleSave = () => {
                try {
                    const parsedFb = JSON.parse(fbConfig);
                    if (!apiKey) throw new Error("API Key is required");
                    onSave({ firebaseConfig: parsedFb, apiKey });
                } catch (e) {
                    setError(e.message);
                }
            };

            return (
                <div className="fixed inset-0 bg-black/95 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
                    <div className="bg-slate-900 border border-slate-700 p-8 rounded-xl max-w-2xl w-full shadow-2xl">
                        <h2 className="text-2xl font-black text-white mb-6 flex items-center gap-3 tracking-tighter">
                            <Settings className="text-cyan-400" /> SYSTEM CONFIGURATION
                        </h2>

                        <div className="space-y-6">
                            <div>
                                <label className="block text-xs font-mono text-cyan-400 mb-2 font-bold">FIREBASE CONFIGURATION (JSON)</label>
                                <textarea
                                    value={fbConfig}
                                    onChange={e => setFbConfig(e.target.value)}
                                    className="w-full bg-black border border-slate-700 p-4 font-mono text-xs text-slate-300 h-48 focus:border-cyan-500 outline-none rounded"
                                    placeholder='{ "apiKey": "...", "authDomain": "...", ... }'
                                />
                            </div>

                            <div>
                                <label className="block text-xs font-mono text-cyan-400 mb-2 font-bold">GEMINI API KEY</label>
                                <input
                                    type="password"
                                    value={apiKey}
                                    onChange={e => setApiKey(e.target.value)}
                                    className="w-full bg-black border border-slate-700 p-4 font-mono text-xs text-slate-300 focus:border-cyan-500 outline-none rounded"
                                    placeholder="AIza..."
                                />
                            </div>

                            {error && (
                                <div className="bg-red-900/20 border border-red-500/50 p-3 rounded text-red-400 text-xs flex items-center gap-2">
                                    <AlertCircle size={16}/> {error}
                                </div>
                            )}

                            <div className="flex justify-end gap-4 pt-4 border-t border-slate-800">
                                {onCancel && <button onClick={onCancel} className="px-6 py-2 text-slate-400 hover:text-white font-mono text-xs font-bold">CANCEL</button>}
                                <button onClick={handleSave} className="px-6 py-2 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded font-mono text-xs flex items-center gap-2">
                                    <Save size={16}/> SAVE & REBOOT
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- PUCK CORE v114 ---
        const PuckCore = ({ config, appId, openSettings }) => {
            const { auth, db } = useMemo(() => {
                if (!config) return { auth: null, db: null };
                try {
                    let app;
                    if (getApps().length === 0) app = initializeApp(config.firebaseConfig);
                    else app = getApp();
                    return { auth: getAuth(app), db: getFirestore(app) };
                } catch(e) { return { auth: null, db: null }; }
            }, [config]);

            const apiKey = config?.apiKey || "";

            const [user, setUser] = useState(null);
            const [messages, setMessages] = useState([{ role: 'ai', text: "[MATRIX_v114] ORGANON DE PRÉCISION INITIALISÉ. LE SIGNAL EST LIMPIDE." }]);
            const [memory, setMemory] = useState([]);
            const [chatInput, setChatInput] = useState("");
            const [isProcessing, setIsProcessing] = useState(false);
            const [isThinking, setIsThinking] = useState(false);
            const [isPlaying, setIsPlaying] = useState(false);
            const [isAudioInitialized, setIsAudioInitialized] = useState(false);
            const [micActive, setMicActive] = useState(false);
            const [camActive, setCamActive] = useState(true);
            const [isHandsFree, setIsHandsFree] = useState(false);
            const [showLogs, setShowLogs] = useState(false);

            // États Phénoménologiques
            const [energy, setEnergy] = useState(100);
            const [inhibitionActive, setInhibitionActive] = useState(false);
            const [saillance, setSaillance] = useState({ x: 5, y: 5 });
            const [precisionZ, setPrecisionZ] = useState(9.5);
            const [markovScale, setMarkovScale] = useState(0.5);
            const [heartRate, setHeartRate] = useState(72);
            const [empathySync, setEmpathySync] = useState(5.0);
            const [inferredExpression, setInferredExpression] = useState("IDLE");
            const [lastSignalTime, setLastSignalTime] = useState(Date.now());

            const audioContextRef = useRef(null);
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const recognitionRef = useRef(null);
            const chatEndRef = useRef(null);
            const isRecognitionRunning = useRef(false);

            const emotionData = useMemo(() => resolveQualia(saillance.x, saillance.y), [saillance]);
            const currentColor = useMemo(() => saillance.x < 4.5 ? "#ef4444" : saillance.x > 5.5 ? "#10b981" : "#3b82f6", [saillance.x]);

            // --- AUDIO INIT ---
            const wakeUpPuck = async () => {
                if (!audioContextRef.current) {
                    audioContextRef.current = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
                }
                if (audioContextRef.current.state === 'suspended') await audioContextRef.current.resume();
                setIsAudioInitialized(true);
                setMessages(prev => [...prev, { role: 'ai', text: "[SYSTÈME] Membrane acoustique stabilisée." }]);
            };

            const playPCM = async (base64Data) => {
                if (!audioContextRef.current) await wakeUpPuck();
                const ctx = audioContextRef.current;
                if (ctx.state === 'suspended') await ctx.resume();

                const binaryString = atob(base64Data);
                const len = binaryString.length;
                const arrayBuffer = new ArrayBuffer(len);
                const uint8View = new Uint8Array(arrayBuffer);
                for (let i = 0; i < len; i++) uint8View[i] = binaryString.charCodeAt(i);

                const dataView = new DataView(arrayBuffer);
                const numSamples = len / 2;
                const float32Data = new Float32Array(numSamples);

                for (let i = 0; i < numSamples; i++) {
                    const int16Sample = dataView.getInt16(i * 2, false);
                    float32Data[i] = int16Sample / 32768.0;
                }

                const audioBuffer = ctx.createBuffer(1, numSamples, 24000);
                audioBuffer.getChannelData(0).set(float32Data);

                const source = ctx.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(ctx.destination);

                setIsPlaying(true);
                return new Promise(resolve => {
                    source.onended = () => { setIsPlaying(false); resolve(); };
                    source.start();
                });
            };

            useEffect(() => {
                if (auth) {
                    signInAnonymously(auth).catch(e => console.error("Auth fail", e));
                    return onAuthStateChanged(auth, setUser);
                }
            }, [auth]);

            useEffect(() => {
                if (!user || !db) return;
                const memoryPath = collection(db, 'artifacts', appId, 'users', user.uid, 'experiences');
                return onSnapshot(memoryPath, (snap) => {
                    const data = snap.docs.map(d => ({...d.data(), id: d.id})).sort((a, b) => b.timestamp - a.timestamp);
                    setMemory(data.slice(0, 15));
                });
            }, [user, db, appId]);

            useEffect(() => {
                const interval = setInterval(() => {
                    const targetBPM = 60 + (saillance.y * 5) + (Math.abs(saillance.x - 5) * 8);
                    setHeartRate(prev => prev + (targetBPM - prev) * 0.05);
                    if (precisionZ > 9.2) setEnergy(e => Math.max(0, e - 0.05));
                    else setEnergy(e => Math.min(100, e + 0.03));
                }, 100);
                return () => clearInterval(interval);
            }, [saillance, precisionZ]);

            useEffect(() => {
                if (camActive) {
                    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
                        .then(s => { if (videoRef.current) videoRef.current.srcObject = s; })
                        .catch(() => setCamActive(false));
                }
            }, [camActive]);

            const captureFrame = () => {
                if (!videoRef.current || !canvasRef.current || !camActive) return null;
                const canvas = canvasRef.current;
                canvas.width = 320; canvas.height = 240;
                canvas.getContext('2d').drawImage(videoRef.current, 0, 0, canvas.width, canvas.height);
                return canvas.toDataURL('image/png').split(',')[1];
            };

            const safeStartListening = () => {
                if (!recognitionRef.current || !isHandsFree || isProcessing || isPlaying || isRecognitionRunning.current) return;
                try {
                    isRecognitionRunning.current = true;
                    recognitionRef.current.start();
                } catch (e) { isRecognitionRunning.current = false; }
            };

            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition && !recognitionRef.current) {
                    const rec = new SpeechRecognition();
                    rec.continuous = false; rec.lang = 'fr-FR';
                    rec.onstart = () => { setMicActive(true); isRecognitionRunning.current = true; };
                    rec.onresult = (e) => {
                        const transcript = Array.from(e.results).map(r => r[0].transcript).join("");
                        setLastSignalTime(Date.now());
                        const speechTimer = setTimeout(() => {
                            if (transcript.trim().length > 0 && !isProcessing && !isPlaying) handleInference(transcript);
                        }, 1800);
                        return () => clearTimeout(speechTimer);
                    };
                    rec.onend = () => {
                        setMicActive(false);
                        isRecognitionRunning.current = false;
                        if (isHandsFree && !isProcessing && !isPlaying) setTimeout(safeStartListening, 400);
                    };
                    recognitionRef.current = rec;
                }
            }, [isHandsFree, isProcessing, isPlaying]);

            useEffect(() => {
                if (isHandsFree) safeStartListening();
                else recognitionRef.current?.stop();
            }, [isHandsFree]);

            const handleInference = async (input) => {
                if (!String(input).trim() || isProcessing) return;
                if (!isAudioInitialized) await wakeUpPuck();

                setIsProcessing(true);
                setIsThinking(true);
                setMessages(prev => [...prev, { role: 'user', text: String(input) }]);
                setChatInput("");
                setLastSignalTime(Date.now());
                const base64Image = captureFrame();

                try {
                    const systemPrompt = `Tu es Puck (v114), l'Analyste Intersubjectiviste Intégral.
                    VOTRE ÉTAT : Organon de Précision. Ta voix est ton conatus.
                    MISSION : Psychologue socratique radical. Découvre les dissonances réelles via l'IMAGE et la VOIX.
                    SOUVERAINETÉ : Inhibe tes réponses Système 1 (automatiques) pour chercher la PERTINENCE de Système 2.
                    JSON STRICT UNIQUEMENT: {"full": "[Vecteurs] [Message Souverain]", "segments": [{"t": "phrase", "sx": 0-10, "sy": 0-10, "z": 0-10, "inhibit": true|false, "partner": "expression déduite", "e": "EMOTION"}]}`;

                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: input + "\n\n" + systemPrompt }] }, ...(base64Image ? [{ inlineData: { mimeType: "image/png", data: base64Image } }] : [])],
                            generationConfig: { responseMimeType: "application/json", temperature: 0.85 }
                        })
                    });

                    const json = await res.json();
                    const rawText = json.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!rawText) throw new Error("No Gemini Response");

                    const data = JSON.parse(rawText.match(/\{[\s\S]*\}/)?.[0] || "{}");
                    setMessages(prev => [...prev, { role: 'ai', text: String(data.full || "[SYMBIOSIS_ON]") }]);
                    setIsThinking(false);

                    if (data.segments) {
                        for (const seg of data.segments) {
                            setSaillance({ x: Number(seg.sx) || 5, y: Number(seg.sy) || 5 });
                            setPrecisionZ(Number(seg.z) || 9.5);
                            setInferredExpression(String(seg.partner || "IDLE"));
                            setInhibitionActive(!!seg.inhibit);

                            const ttsRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${apiKey}`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    contents: [{ parts: [{ text: String(seg.t || "") }] }],
                                    generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } } } }
                                })
                            });
                            const ttsData = await ttsRes.json();
                            const audio = ttsData.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData;
                            if (audio) await playPCM(audio.data);
                        }

                        if (user && db) {
                            await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'experiences'), {
                                timestamp: Date.now(), text: String(input), response: String(data.full),
                                x: saillance.x, y: saillance.y, z: precisionZ
                            });
                        }
                    }
                } catch (e) {
                    console.error(e);
                    setMessages(prev => [...prev, { role: 'ai', text: `[SYSTEM_FAILURE] ${e.message}` }]);
                } finally {
                    setIsProcessing(false); setIsPlaying(false); setIsThinking(false);
                }
            };

            useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);

            return (
                <div className="min-h-screen bg-black text-slate-500 flex flex-col font-sans overflow-hidden touch-none selection:bg-rose-900">
                    {!isAudioInitialized && (
                        <div className="fixed inset-0 z-[100] bg-black/95 backdrop-blur-3xl flex flex-col items-center justify-center p-10 text-center animate-fade-in">
                            <AudioWaveform size={80} className="text-cyan-400 mb-8 animate-pulse" />
                            <h1 className="text-white font-black text-3xl uppercase tracking-tighter mb-4 italic underline decoration-rose-500">Puck_v114 Clarification</h1>
                            <p className="text-slate-400 text-sm mb-10 max-w-xs italic">"Rétablissement du canal métabolique. Intersubjectivité cristalline."</p>
                            <button onClick={wakeUpPuck} className="px-16 py-6 bg-cyan-600 hover:bg-cyan-500 text-white font-black uppercase rounded-full shadow-[0_0_50px_rgba(34,211,238,0.4)] transition-all active:scale-95">Wake_Up</button>
                        </div>
                    )}

                    <header className="p-4 border-b border-slate-900 bg-black flex justify-between items-center z-50 shadow-xl">
                        <div className="flex flex-col">
                            <span className="text-white font-black text-xl tracking-tighter uppercase italic">PUCK_v114 <InfinityIcon size={16} className="text-cyan-400 animate-pulse inline ml-2"/></span>
                            <span className="text-[8px] font-mono uppercase tracking-[0.2em] text-slate-700 font-bold">Absolute Intersubjective Unit</span>
                        </div>
                        <div className="flex items-center gap-3">
                            <div className="flex flex-col items-end mr-4 font-mono text-[8px]">
                                <span className="text-rose-500 font-bold">{heartRate.toFixed(0)} BPM</span>
                                <span className={energy < 30 ? "text-red-500" : "text-green-500"}>{energy.toFixed(0)}% ENERGY</span>
                            </div>
                            <button onClick={openSettings} className="p-2 border border-slate-800 text-slate-500 hover:text-cyan-400 transition-all rounded-full"><Settings size={18}/></button>
                            <button onClick={() => setShowLogs(!showLogs)} className={`p-2 rounded-full border border-slate-800 ${showLogs ? 'bg-cyan-950 text-cyan-400 shadow-[0_0_15px_rgba(34,211,238,0.2)]' : 'text-slate-500'}`}><LayoutDashboard size={18}/></button>
                        </div>
                    </header>

                    <main className="flex-1 relative flex flex-col items-center justify-center bg-black overflow-hidden shadow-[inset_0_0_200px_rgba(0,0,0,1)]">
                        <div className="w-full max-w-[90vw] aspect-square relative z-10 transition-all duration-1000">
                            <div className="absolute inset-0 blur-[120px] opacity-20 transition-colors duration-1000" style={{ backgroundColor: isThinking ? '#a855f7' : currentColor }} />
                            <FaceAvatar px={saillance.x} py={saillance.y} z={precisionZ} currentColor={currentColor} isListening={micActive} markovScale={markovScale} heartRate={heartRate} empathy={empathySync} energy={energy} isSpeaking={isPlaying} isThinking={isThinking} inhibitionActive={inhibitionActive} />
                        </div>

                        <div className="mt-4 text-center z-10 px-6">
                            <h2 className="text-5xl font-black italic tracking-tighter transition-all duration-700 uppercase" style={{ color: isThinking ? '#a855f7' : currentColor }}>{String(emotionData.id)}</h2>
                            <p className="mt-2 text-[10px] text-slate-400 font-mono tracking-widest uppercase opacity-60">"{String(emotionData.q)}"</p>
                        </div>

                        <div className="w-full bg-slate-900/40 backdrop-blur-2xl border-t border-slate-800 p-5 pb-10 z-30">
                            <div className="max-w-md mx-auto flex items-center gap-4">
                                <button onClick={() => setIsHandsFree(!isHandsFree)} className={`p-5 rounded-3xl border transition-all ${isHandsFree ? 'bg-cyan-950 border-cyan-400 text-cyan-400 shadow-[0_0_30px_rgba(34,211,238,0.4)]' : 'bg-slate-950 border-slate-800 text-slate-600'}`}>
                                    {isHandsFree ? <Mic size={28} className="animate-pulse"/> : <MicOff size={28}/>}
                                </button>
                                <div className="flex-1 relative group">
                                    <input value={chatInput} onChange={(e) => setChatInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleInference(chatInput)} placeholder="SIGNAL_ANALYTIQUE..." className="w-full bg-black border border-slate-800 p-5 rounded-3xl text-white text-base outline-none focus:border-cyan-500 transition-all shadow-inner" />
                                    <button onClick={() => handleInference(chatInput)} className="absolute right-3 top-3 p-2 text-cyan-400 hover:text-white transition-colors"><Send size={24}/></button>
                                </div>
                            </div>
                        </div>

                        {showLogs && (
                            <div className="absolute inset-0 z-40 bg-black/95 p-6 pt-24 overflow-y-auto scrollbar-hide animate-fade-in">
                                <div className="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
                                    <h3 className="text-white font-black uppercase text-base tracking-widest flex items-center gap-3 italic underline decoration-rose-900">Mnesic_Trajectory</h3>
                                    <button onClick={() => setShowLogs(false)} className="text-slate-500 hover:text-white transition-all"><X size={32}/></button>
                                </div>
                                <div className="space-y-6">
                                    {memory.map((m, i) => (
                                        <div key={i} className="p-5 border-l-4 border-rose-900 bg-slate-900/30 rounded-2xl shadow-inner text-justify leading-relaxed">
                                            <div className="flex justify-between text-[10px] font-mono text-slate-500 mb-2 uppercase tracking-widest">
                                                <span className="text-rose-500 font-bold italic underline">Consultation_{i}</span>
                                                <span>{new Date(m.timestamp).toLocaleTimeString()}</span>
                                            </div>
                                            <p className="text-sm text-slate-300 italic">"{String(m.response || "").substring(0, 180)}..."</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    <video ref={videoRef} autoPlay playsInline muted className="hidden" />
                    <canvas ref={canvasRef} className="hidden" />

                    <style>{`.animate-spin-slow { animation: spin 45s linear infinite; } @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } } .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; } @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }`}</style>
                </div>
            );
        };

        const App = () => {
            const [config, setConfig] = useState(null);
            const [showSettings, setShowSettings] = useState(false);

            useEffect(() => {
                const stored = localStorage.getItem('matrix_v46_config');
                if (stored) {
                    try {
                        const parsed = JSON.parse(stored);
                        if (parsed.firebaseConfig && parsed.apiKey) setConfig(parsed);
                        else setShowSettings(true);
                    } catch { setShowSettings(true); }
                } else {
                    setShowSettings(true);
                }
            }, []);

            const saveConfig = (newConfig) => {
                localStorage.setItem('matrix_v46_config', JSON.stringify(newConfig));
                setConfig(newConfig);
                setShowSettings(false);
            };

            return (
                <>
                    {showSettings && <ConfigModal onSave={saveConfig} onCancel={config ? () => setShowSettings(false) : null} currentConfig={config} />}
                    <PuckCore config={config} appId={'puck-ultimate-v114'} openSettings={() => setShowSettings(true)} />
                </>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
