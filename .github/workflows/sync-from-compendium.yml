name: Sync from CARTOGRAFFECT Compendium

on:
  repository_dispatch:
    types: [compendium-release]
  workflow_dispatch:
    inputs:
      compendium_tag:
        description: "Tag du compendium CARTOGRAFFECT (ex. v3.0.0)"
        required: true
        default: "v3.0.0"
      payload_url:
        description: "URL brute optionnelle vers site-payload.json (schema 2.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download site-payload.json from CARTOGRAFFECT
        env:
          TAG: ${{ github.event.client_payload.tag || github.event.inputs.compendium_tag || 'v3.0.0' }}
          CUSTOM_URL: ${{ github.event.client_payload.payload_url || github.event.inputs.payload_url || '' }}
        run: |
          URL="$CUSTOM_URL"
          if [ -z "$URL" ]; then
            URL="https://raw.githubusercontent.com/manuelcabelguen-jpg/CARTOGRAFFECT/${TAG}/data/site-payload.json"
          fi
          curl -fsSL "$URL" -o data/site-payload.json
          python3 -c 'import json; d=json.load(open("data/site-payload.json")); assert d.get("schema_version") == "2.0"; print("Loaded schema", d["schema_version"], d["release"]["tag"])'

      - name: Apply payload synchronization and verify parity
        run: |
          python3 scripts/sync_from_payload.py --apply
          python3 scripts/sync_from_payload.py --check

      - name: Commit updated files if changed
        run: |
          git config user.name "cartograffect-bot"
          git config user.email "bot@cartograffect.com"
          git add data/site-payload.json js/compendium_payload.js CITATION.cff *.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(sync): synchronize schema 2.0 counters from CARTOGRAFFECT (${{ github.event.client_payload.tag || github.event.inputs.compendium_tag || 'v3.0.0' }})"
            git push
          else
            echo "No changes to commit."
          fi
