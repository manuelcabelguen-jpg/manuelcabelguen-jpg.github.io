<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartograffect - Live Finance</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'DM Sans', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>

  <!-- React & ReactDOM (UMD via CDN) -->
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>

  <!-- Babel for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Recharts and its dependencies -->
  <script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.js"></script>
  <script crossorigin src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase (compat version for global namespace) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

</head>
<body class="bg-slate-950 text-slate-200 antialiased selection:bg-indigo-500/30">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;
    const {
      ScatterChart, Scatter, XAxis, YAxis, ZAxis, CartesianGrid, Tooltip,
      ResponsiveContainer, ReferenceLine, Cell
    } = window.Recharts;

    // --- Configuration Firebase ---
    // If you don't have these, the app will run without Firebase (Local Storage mode)
    const firebaseConfig = {
      // Add your real config here if needed, or leave empty to use local storage fallback
    };

    // Fallback logic for DB/Auth
    let app, auth, db;
    try {
      if (Object.keys(firebaseConfig).length > 0) {
        app = firebase.initializeApp(firebaseConfig);
        auth = firebase.auth();
        db = firebase.firestore();
      }
    } catch (e) {
      console.warn("Firebase not configured. Using local storage fallback.", e);
    }

    const appId = 'carto-finance-live';

    // Helper component for Lucide Icons
    const Icon = ({ name, size = 24, className = '', color }) => {
      // Convert kebab-case (e.g., 'line-chart') to PascalCase (e.g., 'LineChart')
      const pascalName = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
      const iconData = lucide.icons[pascalName];

      if (!iconData) {
          return <span className={`inline-block border border-dashed border-slate-500 rounded ${className}`} style={{width: size, height: size}} />;
      }

      try {
        const svgNode = lucide.createElement(iconData);
        svgNode.setAttribute('width', size);
        svgNode.setAttribute('height', size);
        if (className) svgNode.setAttribute('class', className);
        if (color) svgNode.setAttribute('stroke', color);

        return <span dangerouslySetInnerHTML={{ __html: svgNode.outerHTML }} className="inline-flex items-center justify-center" />;
      } catch (e) {
         console.warn("Lucide render error for", name, e);
         return <span className={`inline-block border border-dashed border-slate-500 rounded ${className}`} style={{width: size, height: size}} />;
      }
    };

    const App = () => {
      const [user, setUser] = useState({ uid: 'local_user' });
      const [logs, setLogs] = useState([]);
      const [loading, setLoading] = useState(true);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [aiAnalysis, setAiAnalysis] = useState("");
      const [view, setView] = useState('dashboard');
      const [geminiApiKey, setGeminiApiKey] = useState(localStorage.getItem('gemini_api_key') || '');
      const [showApiKeyInput, setShowApiKeyInput] = useState(!geminiApiKey);
      const [useMockMarketData, setUseMockMarketData] = useState(false); // Default to real API since requested
      const [useAiAgent, setUseAiAgent] = useState(false); // Toggle for Gemini AI Governing Agent
      const [apiError, setApiError] = useState(null);

      // Configuration du Portefeuille de l'utilisateur
      const [portfolio, setPortfolio] = useState(() => {
        const saved = localStorage.getItem('carto_portfolio');
        return saved ? JSON.parse(saved) : {
          veqtShares: 1000,
          veqtAvgCost: 38.50,
          cashAvailable: 15000,
        };
      });

      // Flux de données de marché
      const [marketData, setMarketData] = useState({
        vix: { price: 14.5, change: 0, percent: 0 },
        veqt: { price: 40.20, change: 0, percent: 0 },
        cash: { price: 50.00, change: 0, percent: 0 },
        interestRate: 4.5,
        lastSync: new Date().toLocaleTimeString()
      });

      const [isSyncing, setIsSyncing] = useState(false);

      useEffect(() => {
        localStorage.setItem('carto_portfolio', JSON.stringify(portfolio));
      }, [portfolio]);

      useEffect(() => {
        // Init logs from local storage if Firebase is not available
        if (!db) {
          const savedLogs = localStorage.getItem('carto_logs');
          if (savedLogs) {
            setLogs(JSON.parse(savedLogs));
          }
          setLoading(false);
          return;
        }

        if (!user || user.uid === 'local_user') return;

        try {
           // Firestore logic would go here if authenticated
        } catch(e) { console.error(e) }
      }, [user, db]);

      // --- FETCH REAL MARKET DATA (Yahoo Finance & Bank of Canada) ---
      const fetchRealMarketData = async () => {
        setIsSyncing(true);
        setApiError(null);
        try {
          // Fetch data for symbols, requesting 5d range to get chartPreviousClose
          const fetchSymbol = async (sym) => {
              // Using allorigins as a public CORS proxy to bypass browser restrictions on Yahoo Finance
              const targetUrl = encodeURIComponent(`https://query2.finance.yahoo.com/v8/finance/chart/${sym}?range=5d&interval=1d`);
              const proxyUrl = `https://api.allorigins.win/raw?url=${targetUrl}`;
              const res = await fetch(proxyUrl);
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              const data = await res.json();
              const meta = data.chart.result[0].meta;
              const price = meta.regularMarketPrice;
              // Some assets have previousClose, others only chartPreviousClose in the 5d view
              const prev = meta.previousClose || meta.chartPreviousClose || price;
              const change = price - prev;
              const percent = prev !== 0 ? (change / prev) * 100 : 0;
              return { price, change, percent };
          };

          // Fetch Bank of Canada Target Overnight Rate
          const fetchBocRate = async () => {
              const res = await fetch('https://www.bankofcanada.ca/valet/observations/V39079/json?recent=1');
              if (!res.ok) return marketData.interestRate;
              const data = await res.json();
              return parseFloat(data.observations[0].V39079.v);
          };

          const [vixData, veqtData, cashData, bocRate] = await Promise.all([
             fetchSymbol('^VIX'),
             fetchSymbol('VEQT.TO'),
             fetchSymbol('CASH.TO'),
             fetchBocRate()
          ]);

          setMarketData({
            vix: vixData,
            veqt: veqtData,
            cash: cashData,
            interestRate: bocRate,
            lastSync: new Date().toLocaleTimeString()
          });

        } catch (error) {
          console.error("Erreur API de marché:", error);
          setApiError("Erreur de connexion aux APIs financières (CORS / Limite atteinte). Veuillez réessayer plus tard ou utiliser le mode Simulation.");
        } finally {
          setIsSyncing(false);
        }
      };

      // --- SIMULATION API DE MARCHÉ (Stochastique) ---
      const syncMockMarketData = () => {
        setIsSyncing(true);
        setApiError(null);
        setTimeout(() => {
          // Simulation réaliste de variations de marché
          const vixMean = 18;
          const currentVix = marketData.vix.price;
          const vixPull = (vixMean - currentVix) * 0.1;
          const newVixPrice = Math.max(10, Math.min(45, currentVix + vixPull + (Math.random() * 6 - 3)));
          const vixChange = newVixPrice - currentVix;

          const marketShock = (currentVix - newVixPrice) * 0.15;
          const drift = 0.05;
          const currentVeqt = marketData.veqt.price;
          const newVeqtPrice = Math.max(20, currentVeqt + drift + marketShock + (Math.random() * 0.8 - 0.4));
          const veqtChange = newVeqtPrice - currentVeqt;

          const currentCash = marketData.cash.price;
          const newCashPrice = currentCash + (Math.random() * 0.01 - 0.002);
          const cashChange = newCashPrice - currentCash;

          setMarketData({
            vix: { price: newVixPrice, change: vixChange, percent: (vixChange/currentVix)*100 },
            veqt: { price: newVeqtPrice, change: veqtChange, percent: (veqtChange/currentVeqt)*100 },
            cash: { price: newCashPrice, change: cashChange, percent: (cashChange/currentCash)*100 },
            interestRate: marketData.interestRate,
            lastSync: new Date().toLocaleTimeString()
          });
          setIsSyncing(false);
        }, 800);
      };

      const handleSyncMarket = () => {
        if (useMockMarketData) {
          syncMockMarketData();
        } else {
          fetchRealMarketData();
        }
      };

      // --- MOTEUR CARTOGRAFFECT : CONVERSION MARCHÉ -> AFFECT ---
      const calculateCartograffectFromMarket = (port, market) => {
        // 1. Calcul Axe X (Savoir / Valence) : Écart de prédiction basé sur le P&L
        const portfolioValue = port.veqtShares * market.veqt.price;
        const costBasis = port.veqtShares * port.veqtAvgCost;
        const gainLoss = portfolioValue - costBasis;
        // Normalisation: On utilise le % de gain/perte par rapport au coût moyen plutôt qu'une valeur fixe
        const gainLossPercent = costBasis > 0 ? (gainLoss / costBasis) * 100 : 0;
        // X = entre -100 et +100 (ex: 20% de gain = +50 en X)
        const x = Math.max(-100, Math.min(100, gainLossPercent * 2.5)) || 0;

        // 2. Calcul Axe Y (Pouvoir / Activation) : Ratio de Liquidité ajusté
        const totalAssets = portfolioValue + port.cashAvailable;
        const cashRatio = totalAssets > 0 ? (port.cashAvailable / totalAssets) * 100 : 0;
        // 15% de cash est "neutre" (Y=0). En dessous, contrainte. Au dessus, pouvoir.
        const yRaw = (cashRatio - 15) * 4;
        const y = Math.max(-100, Math.min(100, yRaw)) || 0;

        // 3. Calcul Axe Z (Certitude / Précision) : Inversement proportionnel au VIX
        // VIX 10 = 100% Certitude. VIX 40 = 0% Certitude.
        const zRaw = 100 - ((market.vix.price - 10) * (100 / 30));
        const z = Math.max(0, Math.min(100, Math.round(zRaw)));

        // --- IDENTIFICATION DE L'ÉMOTION ---
        const t = 15;
        const isGain = x > t; const isPerte = x < -t;
        const isPouvoir = y > t; const isContrainte = y < -t;
        const isAxialX = Math.abs(x) <= t; const isAxialY = Math.abs(y) <= t;

        let emotion = { name: "Observation (Neutre)", color: "#94a3b8", desc: "Équilibre prédictif." };

        if (isGain && isPouvoir) emotion = { name: "Joie / Euphorie", color: "#10b981", desc: "Conatus en expansion. Modèle validé, liquidité forte." };
        else if (isPerte && isContrainte) emotion = { name: "Tristesse / Capitulation", color: "#3b82f6", desc: "Conatus diminué. Écart négatif massif et impuissance." };
        else if (isPerte && isPouvoir) emotion = { name: "Colère / Combativité", color: "#ef4444", desc: "Allostasie proactive. Erreur subie mais haut pouvoir d'achat." };
        else if (isGain && isContrainte) emotion = { name: "Calme / Soulagement", color: "#8b5cf6", desc: "Régulation homéostasique. Prise de profit requise." };
        else if (isPouvoir && isAxialX) emotion = { name: "Désir / Anticipation", color: "#f59e0b", desc: "Haut pouvoir génératif en attente de déploiement." };
        else if (isContrainte && isAxialX) emotion = { name: "Dégoût / Aversion", color: "#a855f7", desc: "Rejet bottom-up d'une contrainte sans gain." };
        else if (isGain && isAxialY) emotion = { name: "Courage / Assurance", color: "#f43f5e", desc: "Certitude de la validation." };
        else if (isPerte && isAxialY) emotion = { name: "Peur / Sidération", color: "#64748b", desc: "Alerte de l'écart sans liquidité claire." };

        // --- INDICES D'INFÉRENCE ACTIVE ---
        const iea = Math.round(Math.max(0, (Math.abs(Math.min(0, x)) * Math.max(0, y)) / 100)); // Engagement Allostasique
        const trh = Math.round(Math.max(0, -y)); // Restauration Homéostasique
        const ire = Math.round(Math.max(0, (Math.abs(x) * (100 - z)) / 100)); // Révision Épistémique

        // --- CIBLE STRATÉGIQUE ---
        let targetX = x; let targetY = y;
        let actionPolicy = "Maintien (Laisser courir)";
        let targetColor = emotion.color;

        const maxIndex = Math.max(iea, trh, ire);
        if (maxIndex === 0) {
          if (x > 0) targetX = Math.min(100, x + 20);
          actionPolicy = "Exploitation (Laisser courir les gains)";
        } else if (maxIndex === trh) {
          targetY = Math.min(100, y + trh + 20); targetX = x;
          actionPolicy = "Restauration (Liquider pour Cash)"; targetColor = "#3b82f6";
        } else if (maxIndex === iea) {
          targetX = Math.min(100, x + iea + 40); targetY = Math.max(-100, y - (iea / 2));
          actionPolicy = "Engagement Allostasique (Acheter la Baisse)"; targetColor = "#f59e0b";
        } else if (maxIndex === ire) {
          targetX = 0; targetY = 0;
          actionPolicy = "Révision Épistémique (Cash Out / Repenser le Modèle)"; targetColor = "#ec4899";
        }

        return {
          gainLoss, portfolioValue, totalAssets,
          x, y, z, emotion,
          indices: { iea, trh, ire },
          target: { x: targetX, y: targetY, policy: actionPolicy, color: targetColor },
          isAgent: false
        };
      };

      const deterministicState = useMemo(() => calculateCartograffectFromMarket(portfolio, marketData), [portfolio, marketData]);
      const [aiAgentState, setAiAgentState] = useState(null);

      const currentState = (useAiAgent && aiAgentState) ? aiAgentState : deterministicState;

      // --- GEMINI AI GOVERNING AGENT ---
      const fetchAiAgentState = async () => {
        if (!geminiApiKey || !useAiAgent) return;
        setIsAnalyzing(true);
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiApiKey}`;

        const prompt = `Tu es un Agent IA Gouvernant le modèle "Cartograffect". Ton rôle est de calculer la position psychologique et stratégique d'un investisseur en fonction du marché en temps réel, EN REMPLAÇANT les mathématiques déterministes.

        DONNÉES DU MARCHÉ EN TEMPS RÉEL:
        - VIX: ${marketData.vix.price.toFixed(2)} (Variation: ${marketData.vix.percent.toFixed(2)}%)
        - VEQT (Actions): ${marketData.veqt.price.toFixed(2)}$ (Variation: ${marketData.veqt.percent.toFixed(2)}%)
        - CASH (Liquidité): ${marketData.cash.price.toFixed(2)}$
        - Taux Directeur: ${marketData.interestRate}%

        PORTFOLIO DE L'INVESTISSEUR:
        - VEQT: ${portfolio.veqtShares} parts acquises à ${portfolio.veqtAvgCost}$ l'unité.
        - Liquidité restante: ${portfolio.cashAvailable}$
        - Total Actifs: ${(portfolio.veqtShares * marketData.veqt.price + portfolio.cashAvailable).toFixed(2)}$
        - P&L Latent: ${((portfolio.veqtShares * marketData.veqt.price) - (portfolio.veqtShares * portfolio.veqtAvgCost)).toFixed(2)}$

        CALCULS REQUIS (Tu dois générer ces valeurs):
        - X (Savoir/Valence) : de -100 à +100. (ex: fort gain = positif, forte perte = négatif)
        - Y (Pouvoir/Activation) : de -100 à +100. (ex: beaucoup de liquidité = positif, bloqué = négatif)
        - Z (Précision/Certitude) : de 0 à 100. (Impacté par la volatilité VIX).
        - targetX et targetY : Les coordonnées de la Cible Stratégique pour restaurer l'homéostasie.
        - emotion_name: "Joie", "Tristesse", "Colère", "Peur", "Désir", "Dégoût", "Calme", ou "Courage".
        - emotion_color: "#10b981", "#3b82f6", "#ef4444", "#64748b", "#f59e0b", "#a855f7", "#8b5cf6", ou "#f43f5e".
        - emotion_desc: Courte justification.
        - policy: Courte phrase d'action (ex: "Conserver", "Acheter la baisse", "Liquider").
        - targetColor: La couleur de l'action.
        - iea, trh, ire: Indices de 0 à 100 pour l'Inférence Active.

        RÉPONDS UNIQUEMENT AVEC DU JSON VALIDE. Ne mets aucun texte avant ou après.
        Exemple de format:
        {
          "x": 45, "y": 20, "z": 80,
          "emotion": { "name": "Joie / Euphorie", "color": "#10b981", "desc": "Conatus en expansion." },
          "indices": { "iea": 10, "trh": 0, "ire": 5 },
          "target": { "x": 60, "y": 20, "policy": "Laisser courir les gains", "color": "#10b981" }
        }`;

        try {
          const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { responseMimeType: "application/json" }
            })
          });
          const result = await response.json();
          if (result.candidates?.[0]?.content?.parts?.[0]?.text) {
             const aiData = JSON.parse(result.candidates[0].content.parts[0].text);
             setAiAgentState({
                 ...deterministicState, // Keep gainLoss etc
                 x: aiData.x, y: aiData.y, z: aiData.z,
                 emotion: aiData.emotion,
                 indices: aiData.indices,
                 target: aiData.target,
                 isAgent: true
             });
             setAiAnalysis("L'Agent IA Gouvernant a mis à jour les coordonnées du modèle avec succès.");
          }
        } catch (e) {
             console.error("AI Agent Error", e);
             setAiAnalysis("Erreur de l'Agent IA. Retour aux mathématiques déterministes.");
             setUseAiAgent(false);
        } finally {
          setIsAnalyzing(false);
        }
      };

      useEffect(() => {
          if (useAiAgent) {
              fetchAiAgentState();
          } else {
              setAiAgentState(null);
          }
      }, [useAiAgent, marketData]); // Re-run agent when market data changes if enabled

      const handleSubmit = async () => {
        const newLog = {
          id: Date.now().toString(),
          ...marketData,
          ...portfolio,
          computedX: currentState.x,
          computedY: currentState.y,
          computedZ: currentState.z,
          emotion: currentState.emotion.name,
          date: new Date().toISOString().split('T')[0],
          timestamp: Date.now()
        };

        if (db && user.uid !== 'local_user') {
          try {
            await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('logs').add(newLog);
            alert("Inférence sauvegardée dans Firebase.");
          } catch (e) { console.error(e); }
        } else {
          // Local storage fallback
          const newLogs = [...logs, newLog].sort((a, b) => new Date(a.date) - new Date(b.date));
          setLogs(newLogs);
          localStorage.setItem('carto_logs', JSON.stringify(newLogs));
          alert("Inférence sauvegardée localement.");
        }
      };

      const handleDeleteLog = async (logId) => {
        if (db && user.uid !== 'local_user') {
            try {
                await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('logs').doc(logId).delete();
            } catch (e) { console.error(e); }
        } else {
            const newLogs = logs.filter(l => l.id !== logId);
            setLogs(newLogs);
            localStorage.setItem('carto_logs', JSON.stringify(newLogs));
        }
      };

      const saveApiKey = (key) => {
        setGeminiApiKey(key);
        localStorage.setItem('gemini_api_key', key);
        setShowApiKeyInput(false);
      };

      const generateAIInsight = async () => {
        if (!geminiApiKey) {
          setShowApiKeyInput(true);
          return;
        }

        setIsAnalyzing(true);
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiApiKey}`;

        const prompt = `Agis en tant qu'expert en finance comportementale et sciences cognitives utilisant le modèle "Cartograffect" (Version 6.1).
        Données de Marché : VIX = ${marketData.vix.price.toFixed(2)}, VEQT = ${marketData.veqt.price.toFixed(2)}$.
        Position Actuelle du Portfolio : Écart de prédiction (Axe X)=${currentState.x.toFixed(1)} (Gain/Perte: ${currentState.gainLoss.toFixed(2)}$), Pouvoir d'action / Liquidité (Axe Y)=${currentState.y.toFixed(1)}, Précision / Certitude (Axe Z)=${currentState.z}%.
        Diagnostic Émotionnel : ${currentState.emotion.name}.
        Politique d'inférence active dictée par le modèle : "${currentState.target.policy}".

        Rédige un court paragraphe analytique et impactant (environ 3-4 phrases).
        1. Explique brièvement comment la volatilité (VIX) affecte la "Précision" (Z) de l'investisseur en ce moment.
        2. Justifie de façon experte la politique d'inférence active proposée (le vecteur d'action) pour restaurer l'homéostasie financière (le Conatus) en tenant compte de l'émotion dominante et de la liquidité (Y).
        Utilise un ton professionnel, analytique et légèrement philosophique (faisant écho à Spinoza/Friston).`;

        try {
          const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { temperature: 0.7, maxOutputTokens: 300 }
            })
          });
          const result = await response.json();
          if (result.error) {
              if (result.error.code === 400 && result.error.message.includes("API key")) {
                  setAiAnalysis("Clé API invalide. Veuillez vérifier votre clé Gemini.");
                  setShowApiKeyInput(true);
              } else {
                  setAiAnalysis(`Erreur API: ${result.error.message}`);
              }
          } else {
              setAiAnalysis(result.candidates?.[0]?.content?.parts?.[0]?.text || "Erreur de génération.");
          }
        } catch (e) {
            setAiAnalysis("Erreur réseau lors de l'appel à l'API Gemini.");
        } finally {
            setIsAnalyzing(false);
        }
      };

      const trajectoryData = [
        { x: currentState.x, y: currentState.y },
        { x: currentState.target.x, y: currentState.target.y }
      ];

      return (
        <div className="min-h-screen p-4 md:p-8">
          {/* HEADER */}
          <header className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center mb-8 gap-6 border-b border-slate-800 pb-8">
            <div className="flex items-center gap-4">
              <div className="bg-indigo-600 p-3.5 rounded-2xl shadow-lg shadow-indigo-600/20">
                <Icon name="globe" size={32} className="text-white" />
              </div>
              <div>
                <h1 className="text-2xl font-black tracking-tighter uppercase text-white">
                  Cartograffect <span className="text-indigo-400">Live Market</span>
                </h1>
                <p className="text-slate-400 text-[10px] font-bold uppercase tracking-[0.2em]">
                  Intégration Empirique & Inférence Active (v6.1)
                </p>
              </div>
            </div>

            <nav className="flex bg-slate-900 shadow-sm rounded-xl p-1.5 border border-slate-800">

                            return (
                            <tr key={log.id} className="border-b border-slate-800/50 hover:bg-slate-800/50 transition-colors">
                              <td className="px-6 py-5 text-slate-300 font-bold whitespace-nowrap">
                                  {log.date} <span className="text-[10px] text-slate-500 font-mono ml-2">{new Date(log.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                              </td>
                              <td className="px-6 py-5 font-mono text-slate-400 whitespace-nowrap">
                                  <span className={vixPrice > 20 ? 'text-red-400' : ''}>{vixPrice?.toFixed(2) || 'N/A'}</span> / {veqtPrice?.toFixed(2) || 'N/A'}$
                              </td>
                              <td className="px-6 py-5 text-indigo-300 font-bold uppercase tracking-wide">{log.emotion}</td>
                              <td className="px-4 py-5 text-center font-mono text-slate-500">
                                  <span className={log.computedX > 0 ? 'text-emerald-400/70' : 'text-red-400/70'}>{(log.computedX || 0).toFixed(0)}</span> /
                                  <span className={log.computedY > 0 ? 'text-indigo-400/70' : 'text-orange-400/70'}>{(log.computedY || 0).toFixed(0)}</span> /
                                  <span className="text-slate-300">{(log.computedZ || 0)}%</span>
                              </td>
                              <td className="px-6 py-5 text-right">
                                <button
                                    onClick={() => handleDeleteLog(log.id)}
                                    className="text-slate-500 hover:text-red-400 bg-slate-950 hover:bg-red-400/10 p-2 rounded-lg transition-all border border-slate-800 hover:border-red-400/30 inline-flex"
                                    title="Supprimer"
                                >
                                  <Icon name="trash-2" size={16} />
                                </button>
                              </td>
                            </tr>
                          )})}
                        </tbody>
                      </table>
                    </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
