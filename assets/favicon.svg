<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#070b14" stop-opacity="1"/>
    </radialGradient>
    
    <!-- Neon Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <radialGradient id="nodeGlowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeGlowRose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeGlowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background disc -->
  <rect width="64" height="64" rx="14" fill="#070b14"/>
  <rect width="64" height="64" rx="14" fill="url(#bgGlow)"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Cartographic Coordinate Grid -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2,2"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#334155" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="32" y1="10" x2="32" y2="54" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="10" y1="32" x2="54" y2="32" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Constellation Lines -->
  <g stroke="url(#cyanPurple)" stroke-width="1.4" stroke-opacity="0.85" filter="url(#glow)">
    <line x1="32" y1="16" x2="46" y2="28"/>
    <line x1="46" y1="28" x2="42" y2="44"/>
    <line x1="42" y1="44" x2="22" y2="44"/>
    <line x1="22" y1="44" x2="18" y2="28"/>
    <line x1="18" y1="28" x2="32" y2="16"/>
    <!-- Cross links -->
    <line x1="32" y1="16" x2="32" y2="32"/>
    <line x1="46" y1="28" x2="32" y2="32"/>
    <line x1="42" y1="44" x2="32" y2="32"/>
    <line x1="22" y1="44" x2="32" y2="32"/>
    <line x1="18" y1="28" x2="32" y2="32"/>
  </g>

  <!-- Glowing Nodes: Cyan (Emotions), Rose (Crimes), Gold (Miracles) -->
  <!-- Center Node -->
  <circle cx="32" cy="32" r="3" fill="#ffffff" filter="url(#glow)"/>
  
  <!-- North (Emotions - Cyan) -->
  <circle cx="32" cy="16" r="3.2" fill="#38bdf8" filter="url(#glow)"/>
  
  <!-- East (Miracles - Gold) -->
  <circle cx="46" cy="28" r="2.8" fill="#fbbf24" filter="url(#glow)"/>
  
  <!-- South-East (Crimes - Rose) -->
  <circle cx="42" cy="44" r="2.8" fill="#fb7185" filter="url(#glow)"/>
  
  <!-- South-West (Cyan/Indigo) -->
  <circle cx="22" cy="44" r="2.8" fill="#818cf8" filter="url(#glow)"/>
  
  <!-- West (Violet) -->
  <circle cx="18" cy="28" r="2.8" fill="#c084fc" filter="url(#glow)"/>
</svg>
