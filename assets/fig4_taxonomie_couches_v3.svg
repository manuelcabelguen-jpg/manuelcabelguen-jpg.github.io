<svg id="fig4-taxonomie-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 670" width="1100" height="670" role="img" aria-labelledby="fig4-taxonomie-svg-title fig4-taxonomie-svg-desc" preserveAspectRatio="xMidYMid meet" style="background:#FFFFFF"><title id="fig4-taxonomie-svg-title">Figure 4 — Taxonomie en couches planes Z à surface pleine et iso-activation radiale A</title><desc id="fig4-taxonomie-svg-desc">Panneau A : couche illustrative Z = 4 (R = 6), contours d’iso-activation A = 0,25 / 0,50 / 0,75 / 1,00, trois états illustratifs par quadrant, segment d’antagonisme exact et deux rayons iso-cognitifs. Panneau B : empilement des couches Z = 2, 3, 4, 5 et archive exploratoire v2 hors cœur normatif.</desc><defs><marker id="f4-arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0,0.8 L 10,5 L 0,9.2 L 2.6,5 Z" fill="#1E293B"/></marker><marker id="f4-arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0,0.8 L 10,5 L 0,9.2 L 2.6,5 Z" fill="#B45309"/></marker><pattern id="f4-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#CBD5E1" stroke-width="2"/></pattern></defs><rect x="0" y="0" width="1100" height="670" fill="#FFFFFF"/><line x1="628" y1="40" x2="628" y2="660" stroke="#CBD5E1" stroke-width="1"/><text x="20.0" y="26.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="start">A — Couche continue illustrative Z = 4 (R = 6) : surface pleine |x| + |y| ≤ R(Z)</text><text x="20.0" y="44.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#475569" text-anchor="start">(x, y) = A · R(Z) · (u<tspan baseline-shift="sub" font-size="72%">X</tspan>, u<tspan baseline-shift="sub" font-size="72%">Y</tspan>), |u<tspan baseline-shift="sub" font-size="72%">X</tspan>| + |u<tspan baseline-shift="sub" font-size="72%">Y</tspan>| = 1, A ∈ (0, 1] : iso-activation radiale du centre vers la saturation</text><path d="M 300.0,104.0 L 532.0,336.0 L 300.0,568.0 L 68.0,336.0 Z" fill="#C9D3E0" stroke="none"/><path d="M 300.0,162.0 L 474.0,336.0 L 300.0,510.0 L 126.0,336.0 Z" fill="#D8E0EA" stroke="none"/><path d="M 300.0,220.0 L 416.0,336.0 L 300.0,452.0 L 184.0,336.0 Z" fill="#E5EBF2" stroke="none"/><path d="M 300.0,278.0 L 358.0,336.0 L 300.0,394.0 L 242.0,336.0 Z" fill="#F2F5F9" stroke="none"/><path d="M 300.0,278.0 L 358.0,336.0 L 300.0,394.0 L 242.0,336.0 Z" fill="none" stroke="#64748B" stroke-width="1"/><path d="M 300.0,220.0 L 416.0,336.0 L 300.0,452.0 L 184.0,336.0 Z" fill="none" stroke="#64748B" stroke-width="1"/><path d="M 300.0,162.0 L 474.0,336.0 L 300.0,510.0 L 126.0,336.0 Z" fill="none" stroke="#64748B" stroke-width="1"/><path d="M 300.0,104.0 L 532.0,336.0 L 300.0,568.0 L 68.0,336.0 Z" fill="none" stroke="#0F172A" stroke-width="2"/><circle cx="300.0" cy="336.0" r="232.0" fill="none" stroke="#6D28D9" stroke-width="1.3" stroke-dasharray="1.5 3.5" stroke-linecap="round"/><line x1="50" y1="336.0" x2="556" y2="336.0" stroke="#334155" stroke-width="1"/><line x1="300.0" y1="88" x2="300.0" y2="584" stroke="#334155" stroke-width="1"/><text x="562.0" y="340.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="start">+X</text><text x="44.0" y="340.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="end">−X</text><text x="300.0" y="82.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle">+Y</text><text x="300.0" y="598.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle">−Y</text><text x="305.0" y="274.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#334155" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="round">A = 0,25</text><text x="305.0" y="216.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#334155" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="round">A = 0,50</text><text x="305.0" y="158.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#334155" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="round">A = 0,75</text><text x="305.0" y="100.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#334155" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="round">A = 1,00</text><text x="24.0" y="82.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0F172A" text-anchor="start">II · Opposition agentique</text><text x="24.0" y="96.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#475569" text-anchor="start">(−X, +Y)</text><text x="606.0" y="82.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0F172A" text-anchor="end">I · Congruence agentique</text><text x="606.0" y="96.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#475569" text-anchor="end">(+X, +Y)</text><text x="24.0" y="596.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0F172A" text-anchor="start">III · Divergence subie</text><text x="24.0" y="610.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#475569" text-anchor="start">(−X, −Y)</text><text x="606.0" y="596.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0F172A" text-anchor="end">IV · Accommodation secondaire</text><text x="606.0" y="610.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#475569" text-anchor="end">(+X, −Y)</text><line x1="303.3" y1="333.8" x2="418.6" y2="256.9" stroke="#1E293B" stroke-width="1.5" marker-end="url(#f4-arr-ink)"/><line x1="297.8" y1="339.3" x2="220.9" y2="454.6" stroke="#1E293B" stroke-width="1.5" marker-end="url(#f4-arr-ink)"/><line x1="330.5" y1="317.5" x2="281.5" y2="366.5" stroke="#B45309" stroke-width="2" stroke-dasharray="5 3" marker-start="url(#f4-arr-amber)" marker-end="url(#f4-arr-amber)"/><circle cx="336.2" cy="311.9" r="4.5" fill="#0F172A" stroke="#FFFFFF" stroke-width="1"/><text x="344.2" y="324.9" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="round">Sérénité <tspan font-size="9.5" fill="#475569">0,26</tspan></text><circle cx="358.5" cy="227.4" r="4.5" fill="#0F172A" stroke="#FFFFFF" stroke-width="1"/><text x="366.5" y="225.4" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="round">Fierté <tspan font-size="9.5" fill="#475569">0,72</tspan></text><circle cx="425.3" cy="252.5" r="4.5" fill="#0F172A" stroke="#FFFFFF" stroke-width="1"/><text x="433.3" y="256.5" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="round">Engagement fervent <tspan font-size="9.5" fill="#475569">0,90</tspan></text><circle cx="253.6" cy="289.6" r="4.5" fill="#0F172A" stroke="#FFFFFF" stroke-width="1"/><text x="245.6" y="293.6" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="round">Opposition ferme <tspan font-size="9.5" fill="#475569">0,40</tspan></text><circle cx="182.4" cy="272.7" r="4.5" fill="#0F172A" stroke="#FFFFFF" stroke-width="1"/><text x="174.4" y="276.7" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="round">Indignation <tspan font-size="9.5" fill="#475569">0,78</tspan></text><circle cx="238.8" cy="193.1" r="4.5" fill="#0F172A" stroke="#FFFFFF" stroke-width="1"/><text x="230.8" y="197.1" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="round">Hostilité <tspan font-size="9.5" fill="#475569">0,88</tspan></text><circle cx="275.9" cy="372.2" r="4.5" fill="#0F172A" stroke="#FFFFFF" stroke-width="1"/><text x="267.9" y="385.2" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="round">Résignation <tspan font-size="9.5" fill="#475569">0,26</tspan></text><circle cx="220.0" cy="362.7" r="4.5" fill="#0F172A" stroke="#FFFFFF" stroke-width="1"/><text x="212.0" y="364.7" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="round">Honte <tspan font-size="9.5" fill="#475569">0,46</tspan></text><circle cx="216.5" cy="461.3" r="4.5" fill="#0F172A" stroke="#FFFFFF" stroke-width="1"/><text x="208.5" y="473.3" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="round">Angoisse <tspan font-size="9.5" fill="#475569">0,90</tspan></text><circle cx="336.2" cy="355.5" r="4.5" fill="#0F172A" stroke="#FFFFFF" stroke-width="1"/><text x="344.2" y="359.5" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="round">Lâcher-prise <tspan font-size="9.5" fill="#475569">0,24</tspan></text><circle cx="319.7" cy="395.2" r="4.5" fill="#0F172A" stroke="#FFFFFF" stroke-width="1"/><text x="327.7" y="399.2" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="round">Patience <tspan font-size="9.5" fill="#475569">0,34</tspan></text><circle cx="363.1" cy="430.7" r="4.5" fill="#0F172A" stroke="#FFFFFF" stroke-width="1"/><text x="371.1" y="434.7" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="round">Endurance active <tspan font-size="9.5" fill="#475569">0,68</tspan></text><line x1="24" y1="624" x2="54" y2="624" stroke="#B45309" stroke-width="2" stroke-dasharray="5 3" marker-start="url(#f4-arr-amber)" marker-end="url(#f4-arr-amber)"/><text x="62.0" y="628.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#0F172A" text-anchor="start">Segment <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="bold">A</tspan>(x, y, Z) : Sérénité ↔ Résignation, antagonisme exact sur l’anneau A = 0,26 (Z et A conservés)</text><line x1="24" y1="640" x2="54" y2="640" stroke="#1E293B" stroke-width="1.5" marker-end="url(#f4-arr-ink)"/><text x="62.0" y="644.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#0F172A" text-anchor="start">Rayons iso-cognitifs : variation pure de A à orientation (u<tspan baseline-shift="sub" font-size="72%">X</tspan>, u<tspan baseline-shift="sub" font-size="72%">Y</tspan>) constante (Q I et Q III)</text><line x1="24" y1="656" x2="54" y2="656" stroke="#6D28D9" stroke-width="1.5" stroke-dasharray="1.5 3.5" stroke-linecap="round"/><text x="62.0" y="660.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#0F172A" text-anchor="start">A = 1,00 : périmètre de saturation (capacité attentionnelle) ; L2 discret : x² + y² = R(Z)²</text><text x="646.0" y="26.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="start">B — Empilement des couches planes Z ∈ {2, 3, 4, 5}</text><text x="646.0" y="44.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#475569" text-anchor="start">et démarcation épistémique (vue cavalière schématique)</text><path d="M 830.0,74.0 L 1002.0,116.0 L 830.0,158.0 L 658.0,116.0 Z" fill="url(#f4-hatch)" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="704" y="98" width="252" height="38" rx="5" fill="#FFFFFF" fill-opacity="0.93" stroke="#CBD5E1" stroke-width="0.8"/><text x="830.0" y="114.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">Archive exploratoire v2 (Lexicon176, Z = 6, 7)</text><text x="830.0" y="129.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#475569" text-anchor="middle">hors cœur normatif v3.0</text><polyline points="678.0,236.0 716.0,352.0 754.0,452.0 792.0,532.0" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 3"/><polyline points="982.0,236.0 944.0,352.0 906.0,452.0 868.0,532.0" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 3"/><line x1="830.0" y1="554.0" x2="830.0" y2="164.0" stroke="#334155" stroke-width="1.2" stroke-dasharray="2 3"/><path d="M 830.0,184.3 L 982.0,236.0 L 830.0,287.7 L 678.0,236.0 Z" fill="#E2E8F0" stroke="#334155" stroke-width="1.3"/><path d="M 830.0,210.2 L 906.0,236.0 L 830.0,261.8 L 754.0,236.0 Z" fill="none" stroke="#64748B" stroke-width="0.9" stroke-dasharray="2 2"/><circle cx="830.0" cy="236.0" r="3" fill="#0F172A"/><text x="996.0" y="233.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#0F172A" text-anchor="start">Z = 5 · R = 8</text><text x="996.0" y="247.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#0F172A" text-anchor="start">Humeur</text><path d="M 830.0,313.2 L 944.0,352.0 L 830.0,390.8 L 716.0,352.0 Z" fill="#E2E8F0" stroke="#334155" stroke-width="1.3"/><path d="M 830.0,332.6 L 887.0,352.0 L 830.0,371.4 L 773.0,352.0 Z" fill="none" stroke="#64748B" stroke-width="0.9" stroke-dasharray="2 2"/><circle cx="830.0" cy="352.0" r="3" fill="#0F172A"/><text x="996.0" y="349.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#0F172A" text-anchor="start">Z = 4 · R = 6</text><text x="996.0" y="363.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#0F172A" text-anchor="start">Sentiment</text><text x="996.0" y="376.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#475569" text-anchor="start">(coupe du panneau A)</text><path d="M 830.0,426.2 L 906.0,452.0 L 830.0,477.8 L 754.0,452.0 Z" fill="#E2E8F0" stroke="#334155" stroke-width="1.3"/><path d="M 830.0,439.1 L 868.0,452.0 L 830.0,464.9 L 792.0,452.0 Z" fill="none" stroke="#64748B" stroke-width="0.9" stroke-dasharray="2 2"/><circle cx="830.0" cy="452.0" r="3" fill="#0F172A"/><text x="996.0" y="449.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#0F172A" text-anchor="start">Z = 3 · R = 4</text><text x="996.0" y="463.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#0F172A" text-anchor="start">Émotion</text><path d="M 830.0,519.1 L 868.0,532.0 L 830.0,544.9 L 792.0,532.0 Z" fill="#CBD5E1" stroke="#334155" stroke-width="1.3"/><circle cx="830.0" cy="532.0" r="3" fill="#0F172A"/><text x="996.0" y="529.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#0F172A" text-anchor="start">Z = 2 · R = 2</text><text x="996.0" y="543.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#0F172A" text-anchor="start">Fondation</text><text x="996.0" y="556.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#475569" text-anchor="start">canonique</text><text x="830.0" y="576.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#0F172A" text-anchor="middle">A → 0 : convergence polaire au centre de chaque couche</text><text x="646.0" y="604.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#475569" text-anchor="start">R(Z) = 2Z − 2 pour Z ≥ 2 ; Z ∈ [3, 5] : continuum illustratif</text><text x="646.0" y="618.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#475569" text-anchor="start">Couches vues de dessus, surface pleine |x| + |y| ≤ R(Z)</text><text x="646.0" y="632.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#475569" text-anchor="start">Analogue plan compatible avec la Geneva Emotion Wheel</text><text x="646.0" y="646.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#475569" text-anchor="start">(Scherer et al., 2013)</text></svg>
