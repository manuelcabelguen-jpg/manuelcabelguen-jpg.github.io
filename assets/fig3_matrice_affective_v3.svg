<svg id="fig3-matrice-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img" aria-labelledby="fig3-matrice-svg-title fig3-matrice-svg-desc" preserveAspectRatio="xMidYMid meet" style="background:#FFFFFF"><title id="fig3-matrice-svg-title">Figure 3 — Matrice affective 3 × 3 : projection prototypique sur Z ∈ {0, 1, 2} et bijection de Rolls (2014)</title><desc id="fig3-matrice-svg-desc">Grille indexée en colonnes par la polarité épistémique sX (pondérée par πA) et en lignes par la contrôlabilité instrumentale stricte sY (pondérée par πC) ; dix prototypes canoniques dont Calme (+1,−1,2) ; encart : antagoniste géométrique statique par morceaux, bijection 2 × 2 de Rolls (2014) Rew±/Pun± bornée à Z = 2, canal autonome A ≥ 0.</desc><rect x="0" y="0" width="1100" height="600" fill="#FFFFFF"/><text x="442.0" y="34.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Polarité épistémique s<tspan baseline-shift="sub" font-size="72%">X</tspan> ∈ {−1, 0, +1} (pondérée par π<tspan baseline-shift="sub" font-size="72%">A</tspan> ∈ ℝ<tspan baseline-shift="sub" font-size="72%">+</tspan>)</text><text x="262.0" y="78.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">s<tspan baseline-shift="sub" font-size="72%">X</tspan> = −1</text><text x="262.0" y="96.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#475569" text-anchor="middle">Divergence (−X)</text><text x="442.0" y="78.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">s<tspan baseline-shift="sub" font-size="72%">X</tspan> = 0</text><text x="442.0" y="96.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#475569" text-anchor="middle">Neutralité épistémique</text><text x="622.0" y="78.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">s<tspan baseline-shift="sub" font-size="72%">X</tspan> = +1</text><text x="622.0" y="96.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#475569" text-anchor="middle">Congruence (+X)</text><text x="0" y="0" transform="translate(26 325.0) rotate(-90)" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0F172A" text-anchor="middle">Contrôlabilité instrumentale stricte s<tspan baseline-shift="sub" font-size="72%">Y</tspan> ∈ {+1, 0, −1} (pondérée par π<tspan baseline-shift="sub" font-size="72%">C</tspan> ∈ ℝ<tspan baseline-shift="sub" font-size="72%">+</tspan>)</text><text x="48.0" y="170.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="start">s<tspan baseline-shift="sub" font-size="72%">Y</tspan> = +1</text><text x="48.0" y="188.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#475569" text-anchor="start">Maîtrise primaire</text><text x="48.0" y="202.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#1D4ED8" text-anchor="start">(Récompenses Rolls)</text><text x="48.0" y="315.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="start">s<tspan baseline-shift="sub" font-size="72%">Y</tspan> = 0</text><text x="48.0" y="333.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#475569" text-anchor="start">Équilibre</text><text x="48.0" y="347.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#475569" text-anchor="start">instrumental</text><text x="48.0" y="446.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="start">s<tspan baseline-shift="sub" font-size="72%">Y</tspan> = −1</text><text x="48.0" y="464.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#475569" text-anchor="start">Limite objective /</text><text x="48.0" y="478.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#475569" text-anchor="start">Impuissance</text><text x="48.0" y="492.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#1D4ED8" text-anchor="start">(Punitions Rolls)</text><rect x="176.0" y="122.0" width="172.0" height="130.0" rx="8" fill="#EBF1FC" stroke="#1D4ED8" stroke-width="1.4"/><text x="262.0" y="156.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Colère</text><text x="262.0" y="175.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle">(-1,+1,2)</text><text x="273.0" y="201.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#1D4ED8" text-anchor="end">Rew− (</text><text x="277.5" y="201.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#1D4ED8" text-anchor="middle">S</text><line x1="273.0" y1="190.0" x2="282.0" y2="190.0" stroke="#1D4ED8" stroke-width="1.3"/><text x="281.5" y="201.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#1D4ED8" text-anchor="start"><tspan baseline-shift="super" font-size="72%">+</tspan>)</text><text x="262.0" y="221.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.2" font-weight="normal" fill="#334155" text-anchor="middle">Retrait/omission récompense</text><rect x="176.0" y="260.0" width="172.0" height="130.0" rx="8" fill="#FDEEEE" stroke="#B91C1C" stroke-width="1.4"/><text x="262.0" y="303.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Peur</text><text x="262.0" y="322.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle">(-2,0,2)</text><text x="262.0" y="345.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#334155" text-anchor="middle">Charge −, contagion χ &gt; 0</text><rect x="176.0" y="398.0" width="172.0" height="130.0" rx="8" fill="#EBF1FC" stroke="#1D4ED8" stroke-width="1.4"/><text x="262.0" y="432.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Dégoût</text><text x="262.0" y="451.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle">(-1,-1,2)</text><text x="262.0" y="477.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#1D4ED8" text-anchor="middle">Pun+ (S<tspan baseline-shift="super" font-size="72%">−</tspan>)</text><text x="262.0" y="497.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.2" font-weight="normal" fill="#334155" text-anchor="middle">Ajout d’une punition</text><rect x="356.0" y="122.0" width="172.0" height="130.0" rx="8" fill="#E8F5EF" stroke="#047857" stroke-width="1.4"/><text x="442.0" y="165.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Joie</text><text x="442.0" y="184.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle">(0,+2,2)</text><text x="442.0" y="207.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#334155" text-anchor="middle">Décharge +, dissipation γ<tspan baseline-shift="sub" font-size="72%">C</tspan></text><rect x="356.0" y="260.0" width="172.0" height="130.0" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.4"/><text x="442.0" y="295.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Veille <tspan font-weight="normal" font-size="12">(0,0,0)</tspan></text><text x="442.0" y="317.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Surprise <tspan font-weight="normal" font-size="12">(0,0,1)</tspan></text><text x="442.0" y="341.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#334155" text-anchor="middle">Amorçage ascendant</text><text x="442.0" y="355.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#334155" text-anchor="middle">Z = 0 → Z = 1</text><rect x="356.0" y="398.0" width="172.0" height="130.0" rx="8" fill="#FDEEEE" stroke="#B91C1C" stroke-width="1.4"/><text x="442.0" y="441.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Tristesse</text><text x="442.0" y="460.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle">(0,-2,2)</text><text x="442.0" y="483.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#334155" text-anchor="middle">Charge −, contagion χ &gt; 0</text><rect x="536.0" y="122.0" width="172.0" height="130.0" rx="8" fill="#EBF1FC" stroke="#1D4ED8" stroke-width="1.4"/><text x="622.0" y="156.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Désir</text><text x="622.0" y="175.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle">(+1,+1,2)</text><text x="622.0" y="201.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#1D4ED8" text-anchor="middle">Rew+ (S<tspan baseline-shift="super" font-size="72%">+</tspan>)</text><text x="622.0" y="221.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.2" font-weight="normal" fill="#334155" text-anchor="middle">Ajout d’une récompense</text><rect x="536.0" y="260.0" width="172.0" height="130.0" rx="8" fill="#E8F5EF" stroke="#047857" stroke-width="1.4"/><text x="622.0" y="303.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Courage</text><text x="622.0" y="322.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle">(+2,0,2)</text><text x="622.0" y="345.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#334155" text-anchor="middle">Décharge +, dissipation γ<tspan baseline-shift="sub" font-size="72%">A</tspan></text><rect x="536.0" y="398.0" width="172.0" height="130.0" rx="8" fill="#EBF1FC" stroke="#1D4ED8" stroke-width="1.4"/><text x="622.0" y="432.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Calme</text><text x="622.0" y="451.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle">(+1,-1,2)</text><text x="633.0" y="477.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#1D4ED8" text-anchor="end">Pun− (</text><text x="637.5" y="477.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#1D4ED8" text-anchor="middle">S</text><line x1="633.0" y1="466.0" x2="642.0" y2="466.0" stroke="#1D4ED8" stroke-width="1.3"/><text x="641.5" y="477.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#1D4ED8" text-anchor="start"><tspan baseline-shift="super" font-size="72%">−</tspan>)</text><text x="622.0" y="497.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.2" font-weight="normal" fill="#334155" text-anchor="middle">Retrait/omission punition</text><rect x="734.0" y="40.0" width="352.0" height="492.0" rx="8" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/><text x="748.0" y="64.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="start">Encart mathématique</text><text x="748.0" y="90.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0F172A" text-anchor="start">1. Antagoniste géométrique statique</text><text x="748.0" y="110.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="start"><tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="bold">A</tspan>(X,Y,Z) = (−X, −Y, Z)</text><text x="1072.0" y="110.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#475569" text-anchor="end">si XY = 0</text><text x="748.0" y="129.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="start"><tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="bold">A</tspan>(X,Y,Z) = (−sgn(X)|Y|, −sgn(Y)|X|, Z)</text><text x="1072.0" y="129.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#475569" text-anchor="end">si XY ≠ 0</text><text x="748.0" y="148.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#1D4ED8" text-anchor="start">Antagonisme des contingences : Rew+ ↔ Pun+ ; Rew− ↔ Pun−</text><text x="748.0" y="162.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#334155" text-anchor="start">(z2_rolls_bijection_2x2). Brisure cinétique Charge (χ &gt; 0) / γ<tspan baseline-shift="sub" font-size="72%">A</tspan>, γ<tspan baseline-shift="sub" font-size="72%">C</tspan>.</text><text x="748.0" y="196.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0F172A" text-anchor="start">2. Bijection 2 × 2 de Rolls (2014) sur Z = 2</text><text x="748.0" y="215.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#334155" text-anchor="start">Strictement bornée à Z = 2 (rolls_contingencies_z2_bound) :</text><text x="748.0" y="229.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#334155" text-anchor="start">Y discrimine la classe (Rew en +Y / Pun en −Y) ; X la valence ;</text><text x="748.0" y="243.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#334155" text-anchor="start">X·Y l’opérateur (ajout +1 : Rew+, Pun+ / retrait −1 : Rew−, Pun−).</text><text x="748.0" y="261.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#0F172A" text-anchor="start">Note : Rew±/Pun± indexe des stimuli (Rolls, 2014), non les</text><text x="748.0" y="275.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#334155" text-anchor="start">réponses skinneriennes (R− actif en +Y ≠ Calme / Pun− en −Y).</text><text x="748.0" y="289.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#334155" text-anchor="start">Aucun relèvement mécanique sur Z ≥ 3.</text><text x="748.0" y="325.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0F172A" text-anchor="start">3. Canal autonome de mobilisation A ≥ 0</text><text x="748.0" y="344.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#334155" text-anchor="start">Mobilisation allostatique orthogonale à (X, Y) : deux états</text><text x="748.0" y="358.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#334155" text-anchor="start">de mêmes coordonnées (X, Y, Z) peuvent différer en A.</text><text x="748.0" y="376.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#0F172A" text-anchor="start">autonomousActivation_decoupled_from_core</text><text x="748.0" y="414.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0F172A" text-anchor="start">4. Fondation canonique Z ∈ (0, 1, 2)</text><text x="748.0" y="433.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#334155" text-anchor="start">10 prototypes : 8 positions de la couronne Z = 2, plus</text><text x="748.0" y="447.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#334155" text-anchor="start">Veille (0,0,0) et Surprise (0,0,1). La 11ᵉ coordonnée</text><text x="748.0" y="461.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#334155" text-anchor="start">Anticipation (0,0,2) est l’opérateur central de suspension.</text><text x="748.0" y="475.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#334155" text-anchor="start">Z ∈ (3, 4, 5) : taxonomie structurée (Étude 1).</text><rect x="48" y="550" width="18" height="12" rx="3" fill="#FDEEEE" stroke="#B91C1C" stroke-width="1.4"/><text x="74.0" y="560.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#0F172A" text-anchor="start">Pôle axial en Charge −</text><rect x="298" y="550" width="18" height="12" rx="3" fill="#E8F5EF" stroke="#047857" stroke-width="1.4"/><text x="324.0" y="560.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#0F172A" text-anchor="start">Pôle axial en Décharge +</text><rect x="548" y="550" width="18" height="12" rx="3" fill="#EBF1FC" stroke="#1D4ED8" stroke-width="1.4"/><text x="574.0" y="560.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#0F172A" text-anchor="start">Diagonale (bijection Rolls Z = 2)</text><rect x="798" y="550" width="18" height="12" rx="3" fill="#F1F5F9" stroke="#475569" stroke-width="1.4"/><text x="824.0" y="560.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#0F172A" text-anchor="start">Centre Z ∈ (0, 1)</text><text x="48.0" y="584.0" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#475569" text-anchor="start">Lecture : colonnes s<tspan baseline-shift="sub" font-size="72%">X</tspan> et lignes s<tspan baseline-shift="sub" font-size="72%">Y</tspan> portent la polarité ; les précisions π<tspan baseline-shift="sub" font-size="72%">A</tspan>, π<tspan baseline-shift="sub" font-size="72%">C</tspan> ∈ ℝ<tspan baseline-shift="sub" font-size="72%">+</tspan> pondèrent sans changer de signe. Coordonnées entières (X, Y, Z) de la fondation canonique.</text></svg>
